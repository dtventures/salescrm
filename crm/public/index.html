<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Outreach CRM</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #FFFFFF; --sidebar: #FAFAFA; --hover: #F4F4F4; --active: #EFEFEF; --selected: #F2F6FF;
    --border: #EBEBEB; --border-strong: #D6D6D6;
    --text: #333333; --strong: #1A1A1A; --muted: #666666; --faint: #999999;
    --accent: #1961ED; --accent-soft: #EEF3FE;
    --green: #16A34A; --green-soft: #E9F7EE; --amber: #B45309; --amber-soft: #FEF5E7;
    --error: #B91C1C; --error-soft: #FEF2F2;
    --shadow: 0 0 0 1px rgb(0 0 0 / .04), 0 8px 24px rgb(0 0 0 / .08);
    --av-l: 92%; --av-s: 70%; --av-ink-l: 34%;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #171717; --sidebar: #1B1B1B; --hover: #222222; --active: #292929; --selected: #1C2333;
      --border: #2A2A2A; --border-strong: #3A3A3A;
      --text: #E4E4E4; --strong: #FAFAFA; --muted: #A3A3A3; --faint: #6E6E6E;
      --accent: #6E9BFF; --accent-soft: #1C2538;
      --green: #4ADE80; --green-soft: #15291D; --amber: #FBBF24; --amber-soft: #2D2413;
      --error: #FCA5A5; --error-soft: #2A1517;
      --shadow: 0 0 0 1px rgb(255 255 255 / .06), 0 12px 32px rgb(0 0 0 / .5);
      --av-l: 24%; --av-s: 35%; --av-ink-l: 78%;
    }
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0; background: var(--bg); color: var(--text);
    font: 13px/1.45 Inter, ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
    font-feature-settings: "cv11", "ss01"; -webkit-font-smoothing: antialiased;
  }
  button { font: inherit; color: inherit; cursor: pointer; }
  svg.i { width: 15px; height: 15px; flex: none; stroke: currentColor; fill: none; stroke-width: 1.7; stroke-linecap: round; stroke-linejoin: round; }
  :focus-visible { outline: 2px solid var(--accent); outline-offset: -2px; border-radius: 4px; }

  .app { display: grid; grid-template-columns: 224px 1fr; height: 100vh; }

  /* Sidebar */
  .sidebar { background: var(--sidebar); border-right: 1px solid var(--border); display: flex; flex-direction: column; padding: 8px; gap: 2px; min-width: 0; }
  .ws { display: flex; align-items: center; gap: 8px; height: 32px; padding: 0 8px; margin-bottom: 10px; font-weight: 600; color: var(--strong); font-size: 14px; }
  .ws-mark { width: 22px; height: 22px; border-radius: 6px; background: var(--strong); color: var(--bg); display: grid; place-items: center; font-size: 12px; font-weight: 600; }
  .nav-btn {
    display: flex; align-items: center; gap: 8px; width: 100%; border: 0; background: none; text-align: left;
    padding: 6px 8px; border-radius: 6px; color: var(--muted); font-weight: 500;
  }
  .nav-btn:hover { background: var(--hover); color: var(--text); }
  .nav-btn[aria-current="page"] { background: var(--active); color: var(--strong); }
  .nav-btn .count { margin-left: auto; color: var(--faint); font-weight: 400; font-variant-numeric: tabular-nums; }
  .nav-btn kbd { margin-left: auto; font: inherit; font-size: 11px; color: var(--faint); border: 1px solid var(--border); border-radius: 4px; padding: 0 5px; background: var(--bg); }
  .nav-label { padding: 14px 8px 4px; font-size: 11px; font-weight: 500; color: var(--faint); letter-spacing: .02em; }
  .sidebar-foot { margin-top: auto; border-top: 1px solid var(--border); padding: 10px 8px 2px; display: flex; align-items: center; gap: 8px; color: var(--muted); font-size: 12px; }
  .sidebar-foot span { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .dot { width: 7px; height: 7px; border-radius: 50%; background: var(--green); flex: none; }
  .dot.busy { background: var(--accent); animation: pulse .9s infinite alternate; }
  .dot.err { background: var(--error); }
  @keyframes pulse { to { opacity: .3; } }
  .icon-btn { border: 0; background: none; width: 26px; height: 26px; border-radius: 6px; display: grid; place-items: center; color: var(--muted); }
  .icon-btn:hover { background: var(--hover); color: var(--strong); }
  .icon-btn:disabled { opacity: .5; cursor: default; }
  .spin svg { animation: spin 1s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }

  /* Main */
  .main { display: flex; flex-direction: column; min-width: 0; min-height: 0; }
  .topbar { height: 48px; flex: none; display: flex; align-items: center; gap: 8px; padding: 0 16px; border-bottom: 1px solid var(--border); }
  .topbar h1 { font-size: 14px; font-weight: 500; color: var(--strong); margin: 0; display: flex; align-items: center; gap: 8px; }
  .topbar .total { color: var(--faint); font-weight: 400; }
  .topbar .spacer { flex: 1; }
  .btn { display: inline-flex; align-items: center; gap: 6px; height: 28px; padding: 0 10px; border-radius: 6px; border: 1px solid var(--border); background: var(--bg); color: var(--text); font-weight: 500; }
  .btn:hover { background: var(--hover); border-color: var(--border-strong); }
  .btn:disabled { opacity: .6; cursor: default; }
  .mobile-nav { display: none; }

  .viewbar { flex: none; display: flex; align-items: center; gap: 6px; padding: 8px 16px; border-bottom: 1px solid var(--border); flex-wrap: wrap; }
  .chip { display: inline-flex; align-items: center; gap: 6px; height: 26px; padding: 0 9px; border-radius: 6px; border: 1px solid transparent; background: none; color: var(--muted); font-weight: 500; }
  .chip:hover { background: var(--hover); color: var(--text); }
  .chip[aria-pressed="true"] { background: var(--accent-soft); color: var(--accent); }
  .chip .n { color: inherit; opacity: .6; font-weight: 400; font-variant-numeric: tabular-nums; }
  .viewbar .spacer { flex: 1; }
  .sort-chip { color: var(--muted); }
  .search { display: flex; align-items: center; gap: 6px; height: 28px; padding: 0 8px; border-radius: 6px; border: 1px solid var(--border); color: var(--faint); width: 220px; }
  .search:focus-within { border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); }
  .search input { border: 0; outline: 0; background: none; font: inherit; color: var(--text); width: 100%; }

  .banner { flex: none; margin: 8px 16px 0; padding: 8px 12px; border-radius: 6px; background: var(--error-soft); color: var(--error); }
  .banner[hidden] { display: none; }

  /* Grid */
  .grid-wrap { flex: 1; overflow: auto; min-height: 0; }
  table { border-collapse: separate; border-spacing: 0; width: 100%; min-width: max-content; }
  th, td { height: 36px; padding: 0 10px; border-bottom: 1px solid var(--border); border-right: 1px solid var(--border); white-space: nowrap; text-align: left; vertical-align: middle; background: var(--bg); }
  th:last-child, td:last-child { border-right: 0; width: 100%; }
  th:first-child, td:first-child { position: sticky; left: 0; z-index: 1; padding-left: 16px; }
  thead th { position: sticky; top: 0; z-index: 2; height: 34px; font-weight: 500; color: var(--muted); }
  thead th:first-child { z-index: 3; }
  th button { border: 0; background: none; padding: 0; display: inline-flex; align-items: center; gap: 6px; color: inherit; font-weight: inherit; }
  th button:hover { color: var(--strong); }
  th .i { color: var(--faint); }
  th .arrow { color: var(--strong); font-size: 11px; }
  th.num button { flex-direction: row-reverse; }
  .num { text-align: right; font-variant-numeric: tabular-nums; }
  tbody tr { cursor: pointer; }
  tbody tr:hover td { background: var(--hover); }
  tbody tr.sel td { background: var(--selected); }
  tfoot td { position: sticky; bottom: 0; z-index: 2; border-top: 1px solid var(--border); border-bottom: 0; color: var(--faint); height: 34px; cursor: default; }
  tfoot td:first-child { z-index: 3; }
  tfoot b { color: var(--text); font-weight: 500; font-variant-numeric: tabular-nums; }
  .w-name { min-width: 240px; }
  .cell { display: flex; align-items: center; gap: 8px; }
  .name { color: var(--strong); font-weight: 500; overflow: hidden; text-overflow: ellipsis; }
  .muted { color: var(--muted); }
  .faint { color: var(--faint); }
  .rel { color: var(--faint); margin-left: 6px; }

  .av, .logo {
    --h: 210; flex: none; width: 20px; height: 20px; display: inline-grid; place-items: center; position: relative; overflow: hidden;
    font-size: 10px; font-weight: 600; background: hsl(var(--h) var(--av-s) var(--av-l)); color: hsl(var(--h) 45% var(--av-ink-l));
  }
  .av { border-radius: 50%; }
  .logo { border-radius: 5px; }
  .logo img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: contain; background: var(--bg); }
  .av.lg, .logo.lg { width: 40px; height: 40px; font-size: 17px; }
  .logo.lg { border-radius: 9px; }
  .stack { display: inline-flex; align-items: center; }
  .stack .av { box-shadow: 0 0 0 2px var(--bg); }
  .stack .av + .av { margin-left: -6px; }
  .stack + span { margin-left: 8px; }

  .tag { display: inline-flex; align-items: center; gap: 5px; height: 22px; padding: 0 8px; border-radius: 4px; font-weight: 500; font-size: 12px; background: var(--hover); color: var(--muted); }
  .tag::before { content: ""; width: 6px; height: 6px; border-radius: 50%; background: currentColor; opacity: .8; }
  .tag.week { background: var(--green-soft); color: var(--green); }
  .tag.month { background: var(--amber-soft); color: var(--amber); }
  .pill { display: inline-flex; align-items: center; gap: 6px; height: 22px; padding: 0 8px 0 3px; border-radius: 4px; background: var(--hover); color: var(--text); font-weight: 500; border: 0; }
  .pill .logo { width: 16px; height: 16px; font-size: 9px; border-radius: 4px; }
  button.pill:hover { background: var(--active); }
  .pill.plain { padding-left: 8px; color: var(--muted); font-weight: 400; }

  .empty { padding: 80px 16px; text-align: center; color: var(--muted); cursor: default; }
  .empty b { display: block; color: var(--strong); font-weight: 500; font-size: 14px; margin-bottom: 4px; }
  tbody tr.empty-row:hover td { background: var(--bg); }

  /* Record panel */
  .panel {
    position: fixed; top: 8px; right: 8px; bottom: 8px; width: 440px; max-width: calc(100vw - 16px);
    background: var(--bg); border-radius: 10px; box-shadow: var(--shadow); display: flex; flex-direction: column; z-index: 10;
    transform: translateX(calc(100% + 16px)); transition: transform .18s ease; visibility: hidden;
  }
  .panel.open { transform: none; visibility: visible; }
  .panel-top { display: flex; align-items: center; gap: 6px; padding: 8px 10px; border-bottom: 1px solid var(--border); color: var(--muted); }
  .panel-top .crumb { flex: 1; display: flex; align-items: center; gap: 6px; }
  .panel-body { overflow: auto; flex: 1; }
  .rec-head { padding: 20px 20px 16px; display: flex; gap: 14px; align-items: center; }
  .rec-head h2 { margin: 0; font-size: 18px; font-weight: 600; color: var(--strong); letter-spacing: -.01em; }
  .rec-head p { margin: 2px 0 0; color: var(--muted); }
  .rec-stats { display: grid; grid-template-columns: repeat(3, 1fr); margin: 0 20px 8px; border: 1px solid var(--border); border-radius: 8px; }
  .rec-stats div { padding: 10px 12px; }
  .rec-stats div + div { border-left: 1px solid var(--border); }
  .rec-stats b { display: block; font-size: 16px; font-weight: 600; color: var(--strong); font-variant-numeric: tabular-nums; }
  .rec-stats span { color: var(--faint); font-size: 12px; }
  .section { padding: 12px 20px; }
  .section h3 { margin: 0 0 8px; font-size: 12px; font-weight: 500; color: var(--faint); display: flex; align-items: center; gap: 6px; }
  .section h3 .n { margin-left: auto; font-weight: 400; }
  .fields { display: grid; grid-template-columns: 128px 1fr; row-gap: 2px; }
  .fields dt { color: var(--muted); display: flex; align-items: center; gap: 8px; height: 30px; }
  .fields dt .i { color: var(--faint); }
  .fields dd { margin: 0; display: flex; align-items: center; min-height: 30px; padding: 0 8px; border-radius: 6px; color: var(--strong); }
  .list-row { display: flex; align-items: center; gap: 10px; width: 100%; border: 0; background: none; padding: 7px 8px; margin: 0 -8px; border-radius: 6px; text-align: left; width: calc(100% + 16px); }
  .list-row:hover { background: var(--hover); }
  .list-row .meta { margin-left: auto; color: var(--faint); font-variant-numeric: tabular-nums; }
  .list-row .who { min-width: 0; overflow: hidden; text-overflow: ellipsis; }
  .timeline { position: relative; }
  .timeline::before { content: ""; position: absolute; left: 13px; top: 8px; bottom: 8px; width: 1px; background: var(--border); }
  .ev { display: flex; gap: 12px; padding: 6px 0; position: relative; }
  .ev-icon { width: 27px; height: 27px; border-radius: 50%; background: var(--bg); border: 1px solid var(--border); display: grid; place-items: center; color: var(--muted); flex: none; z-index: 1; }
  .ev-icon .i { width: 13px; height: 13px; }
  .ev-body { flex: 1; min-width: 0; padding-top: 4px; }
  .ev-line { display: flex; gap: 8px; color: var(--muted); }
  .ev-line b { color: var(--strong); font-weight: 500; }
  .ev-line time { margin-left: auto; color: var(--faint); white-space: nowrap; }
  .ev-subject { margin-top: 4px; padding: 6px 10px; border: 1px solid var(--border); border-radius: 6px; color: var(--text); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .scrim { position: fixed; inset: 0; z-index: 9; display: none; }
  .scrim.open { display: block; }

  @media (max-width: 767px) {
    .app { grid-template-columns: 1fr; }
    .sidebar { display: none; }
    .mobile-nav { display: inline-flex; gap: 2px; }
    .topbar h1 { display: none; }
    .search { width: 100%; order: 10; }
    .sort-chip { display: none; }
    #filters { display: flex; overflow-x: auto; margin: 0 -16px; padding: 0 16px; }
    #filters .chip { flex: none; }
    .viewbar .spacer { display: none; }
    .w-name { min-width: 180px; }
    .panel { top: 0; right: 0; bottom: 0; border-radius: 0; max-width: 100vw; width: 100vw; }
  }
</style>
</head>
<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <symbol id="i-building" viewBox="0 0 24 24"><path d="M4 21V5a2 2 0 0 1 2-2h8a2 2 0 0 1 2 2v16M16 9h2a2 2 0 0 1 2 2v10M3 21h18M8 7h4M8 11h4M8 15h4"/></symbol>

<div class="app">
  <aside class="sidebar">
    <div class="ws"><span class="ws-mark">O</span>Outreach</div>
    <button class="nav-btn" id="nav-search"><svg class="i"><use href="#i-search"/></svg>Search<kbd>/</kbd></button>
    <div class="nav-label">Records</div>
    <button class="nav-btn" data-view="companies"><svg class="i"><use href="#i-building"/></svg>Companies<span class="count" id="c-companies"></span></button>
    <button class="nav-btn" data-view="people"><svg class="i"><use href="#i-user"/></svg>People<span class="count" id="c-people"></span></button>
    <div class="sidebar-foot">
      <i class="dot" id="dot"></i><span id="status">Loading…</span>
      <button class="icon-btn" id="sync" title="Sync now" aria-label="Sync now"><svg class="i"><use href="#i-refresh"/></svg></button>
    </div>
  </aside>

  <section class="main">
    <header class="topbar">
      <h1 id="title"></h1>
      <div class="mobile-nav">
        <button class="chip" data-view="companies">Companies</button>
        <button class="chip" data-view="people">People</button>
      </div>
      <span class="spacer"></span>
      <button class="btn" id="sync2"><svg class="i"><use href="#i-refresh"/></svg><span>Sync now</span></button>
    </header>
    <div class="viewbar">
      <div id="filters" role="group" aria-label="Last contact"></div>
      <span class="spacer"></span>
      <button class="chip sort-chip" id="sort-chip"></button>
      <label class="search"><svg class="i"><use href="#i-search"/></svg><input id="q" type="search" placeholder="Search…" aria-label="Search"></label>
    </div>

</div>

<aside class="panel" id="panel" aria-label="Record details"></aside>

<script>
const DAY = 86400000;
const state = {
  data: null, view: 'companies', q: '', bucket: 'all',
  sort: { key: 'lastContact', dir: -1 }, record: null,
};

const ICON = (id) => `<svg class="i"><use href="#i-${id}"/></svg>`;
const COLUMNS = {
  companies: [
    { key: 'domain', label: 'Company', icon: 'building', cls: 'w-name' },
    { key: 'people', label: 'People', icon: 'users' },
    { key: 'activity', label: 'Activity', icon: 'pulse', sortKey: 'lastContact' },
    { key: 'timesContacted', label: 'Emails sent', icon: 'hash', num: true },
    { key: 'firstContact', label: 'First contact', icon: 'cal' },
    { key: 'lastContact', label: 'Last contact', icon: 'clock' },
    { key: 'addedAt', label: 'Added', icon: 'plus' },
  ],
  people: [
    { key: 'name', label: 'Name', icon: 'user', cls: 'w-name' },
    { key: 'email', label: 'Email', icon: 'mail' },
    { key: 'company', label: 'Company', icon: 'building' },
    { key: 'activity', label: 'Activity', icon: 'pulse', sortKey: 'lastContact' },
    { key: 'timesContacted', label: 'Emails sent', icon: 'hash', num: true },
    { key: 'firstContact', label: 'First contact', icon: 'cal' },
    { key: 'lastContact', label: 'Last contact', icon: 'clock' },
    { key: 'addedAt', label: 'Added', icon: 'plus' },
  ],
};
const BUCKETS = [
  { id: 'all', label: 'All' },
  { id: 'week', label: 'This week' },
  { id: 'month', label: 'This month' },
  { id: 'quiet', label: 'Gone quiet' },
];

const $ = (id) => document.getElementById(id);
const esc = (s) => String(s ?? '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const fmtDate = (iso) => iso ? new Date(iso).toLocaleDateString(undefined, { month: 'short', day: 'numeric', year: 'numeric' }) : '';
const hue = (s) => [...String(s)].reduce((h, c) => (h * 31 + c.charCodeAt(0)) % 360, 7);
const displayName = (p) => p.name || p.email;

function ago(iso) {
  if (!iso) return '';
  const s = (Date.now() - new Date(iso)) / 1000;
  if (s < 60) return 'just now';
  for (const [secs, u] of [[31536000, 'y'], [2592000, 'mo'], [604800, 'w'], [86400, 'd'], [3600, 'h'], [60, 'm']]) {
    if (s >= secs) return `${Math.floor(s / secs)}${u} ago`;
  }
}

function bucketOf(iso) {
  if (!iso) return 'quiet';
  const age = Date.now() - new Date(iso);
  return age <= 7 * DAY ? 'week' : age <= 30 * DAY ? 'month' : 'quiet';
}
const BUCKET_TAG = { week: 'This week', month: 'This month', quiet: 'Quiet' };

function initials(p) {
  const parts = (p.name || p.email.split('@')[0]).split(/[\s._-]+/).filter(Boolean);
  return ((parts[0]?.[0] || '') + (parts.length > 1 ? parts[parts.length - 1][0] : '')).toUpperCase() || '?';
}
const avatar = (p, size = '', one = false) => `<span class="av ${size}" style="--h:${hue(p.email)}">${esc(one ? initials(p)[0] : initials(p))}</span>`;
function logo(domain, size = '') {
  const img = state.data.logos ? `<img alt="" loading="lazy" src="https://icons.duckduckgo.com/ip3/${encodeURIComponent(domain)}.ico" onerror="this.remove()">` : '';
  return `<span class="logo ${size}" style="--h:${hue(domain)}">${esc(domain[0].toUpperCase())}${img}</span>`;
}

const peopleAt = (domain) => state.data.people.filter((p) => p.company === domain);

function cell(col, r) {
  const v = r[col.key];
  switch (col.key) {
    case 'domain': return `<div class="cell">${logo(v)}<span class="name">${esc(v)}</span></div>`;
    case 'name': return `<div class="cell">${avatar(r)}<span class="name">${esc(displayName(r))}</span></div>`;
    case 'email': return `<span class="muted">${esc(v)}</span>`;
    case 'company': return v ? `<span class="pill">${logo(v)}${esc(v)}</span>` : '<span class="pill plain">Personal</span>';
    case 'people': {
      const ppl = peopleAt(r.domain);
      return `<div class="cell"><span class="stack">${ppl.slice(0, 3).map((p) => avatar(p, '', true)).join('')}</span><span class="muted">${ppl.length}</span></div>`;
    }
    case 'activity': { const b = bucketOf(r.lastContact); return `<span class="tag ${b}">${BUCKET_TAG[b]}</span>`; }
    case 'lastContact': return `${fmtDate(v)}<span class="rel">${ago(v)}</span>`;
    case 'firstContact': case 'addedAt': return fmtDate(v);
    default: return esc(v);
  }
}

function matches(r) {
  const q = state.q.trim().toLowerCase();
  if (!q) return true;
  if (state.view === 'people') return `${r.name} ${r.email}`.toLowerCase().includes(q);
  return r.domain.includes(q) || peopleAt(r.domain).some((p) => `${p.name} ${p.email}`.toLowerCase().includes(q));
}

function sorted(list) {
  const { key, dir } = state.sort;
  return [...list].sort((a, b) => {
    let x = a[key], y = b[key];
    if (key === 'name') { x = displayName(a); y = displayName(b); }
    if (typeof x === 'number') return (x - y) * dir;
    if (!x) return 1;
    if (!y) return -1;
    return String(x).localeCompare(String(y)) * dir;
  });
}

function visibleRows() {
  const base = state.data[state.view].filter(matches);
  return sorted(state.bucket === 'all' ? base : base.filter((r) => bucketOf(r.lastContact) === state.bucket));
}

function render() {
  const d = state.data;
  const cols = COLUMNS[state.view];
  const isCo = state.view === 'companies';

  $('c-companies').textContent = d.companies.length;
  $('c-people').textContent = d.people.length;
  document.querySelectorAll('[data-view]').forEach((b) => {
    const on = b.dataset.view === state.view;
    if (b.classList.contains('chip')) b.setAttribute('aria-pressed', on);
    else if (on) b.setAttribute('aria-current', 'page');
    else b.removeAttribute('aria-current');
  });
  $('title').innerHTML = `${ICON(isCo ? 'building' : 'user')}${isCo ? 'Companies' : 'People'} <span class="total">${d[state.view].length}</span>`;

  const searched = d[state.view].filter(matches);
  $('filters').innerHTML = BUCKETS.map((b) => {
    const n = b.id === 'all' ? searched.length : searched.filter((r) => bucketOf(r.lastContact) === b.id).length;
    return `<button class="chip" data-bucket="${b.id}" aria-pressed="${state.bucket === b.id}">${b.label} <span class="n">${n}</span></button>`;
  }).join('');
  const sortCol = cols.find((c) => c.key === state.sort.key);
  $('sort-chip').innerHTML = `${ICON('sort')}Sorted by ${esc(sortCol?.label || 'Last contact')} ${state.sort.dir > 0 ? '↑' : '↓'}`;

  const rows = visibleRows();
  const head = `<thead><tr>${cols.map((c) => {
    const key = c.sortKey || c.key;
    const on = state.sort.key === key && !c.sortKey;
    return `<th class="${c.num ? 'num' : ''} ${c.cls || ''}" aria-sort="${on ? (state.sort.dir > 0 ? 'ascending' : 'descending') : 'none'}"><button data-sort="${key}">${ICON(c.icon)}${c.label}${on ? `<span class="arrow">${state.sort.dir > 0 ? '↑' : '↓'}</span>` : ''}</button></th>`;
  }).join('')}<th></th></tr></thead>`;

  let body = rows.map((r) => {
    const id = isCo ? r.domain : r.email;
    return `<tr data-id="${esc(id)}" tabindex="0" class="${state.record?.id === id ? 'sel' : ''}">${cols.map((c) => `<td class="${c.num ? 'num' : ''} ${c.cls || ''}">${cell(c, r)}</td>`).join('')}<td></td></tr>`;
  }).join('');
  if (!rows.length) {
    const [t, m] = state.q || state.bucket !== 'all'
      ? ['No matches', 'Try another search or filter.']
      : ['Nothing here yet', 'People you email show up here after the next sync.'];
    body = `<tr class="empty-row"><td colspan="${cols.length + 1}" class="empty"><b>${t}</b>${m}</td></tr>`;
  }

  const sum = rows.reduce((n, r) => n + r.timesContacted, 0);
  const foot = `<tfoot><tr>${cols.map((c) => {
    if (c.cls === 'w-name') return `<td class="w-name"><b>${rows.length}</b> ${isCo ? (rows.length === 1 ? 'company' : 'companies') : (rows.length === 1 ? 'person' : 'people')}</td>`;
    if (c.key === 'timesContacted') return `<td class="num">Sum <b>${sum}</b></td>`;
    if (c.key === 'people') return `<td><b>${rows.reduce((n, r) => n + r.people, 0)}</b> total</td>`;
    return '<td></td>';
  }).join('')}<td></td></tr></tfoot>`;

  $('grid').innerHTML = head + `<tbody>${body}</tbody>` + foot;
  renderStatus();
  if (state.record) renderPanel();
}

function renderStatus() {
  const d = state.data, s = d.sync || {};
  const busy = d.syncing;
  $('dot').className = `dot ${busy ? 'busy' : s.lastError ? 'err' : ''}`;
  $('status').textContent = busy ? 'Syncing sent mail…' : s.lastSyncAt ? `Synced ${ago(s.lastSyncAt)}` : 'Not synced yet';
  for (const b of [$('sync'), $('sync2')]) { b.disabled = busy; b.classList.toggle('spin', busy); }
  $('error').hidden = !s.lastError;
  $('error').textContent = s.lastError ? `Last sync failed: ${s.lastError}` : '';
}

/* Record panel */

function openRecord(type, id) {
  state.record = { type, id };
  renderPanel();
  $('panel').classList.add('open');
  $('scrim').classList.add('open');
  document.querySelectorAll('tbody tr').forEach((tr) => tr.classList.toggle('sel', tr.dataset.id === id));
}

function closeRecord() {
  const id = state.record?.id;
  state.record = null;
  $('panel').classList.remove('open');
  $('scrim').classList.remove('open');
  document.querySelectorAll('tbody tr.sel').forEach((tr) => tr.classList.remove('sel'));
  document.querySelector(`tbody tr[data-id="${CSS.escape(id || '')}"]`)?.focus();
}

const field = (icon, label, value) => `<dt>${ICON(icon)}${label}</dt><dd>${value || '<span class="faint">—</span>'}</dd>`;
const dateVal = (iso, rel) => iso ? `${fmtDate(iso)}${rel ? `<span class="rel">${ago(iso)}</span>` : ''}` : '';

function timeline(events) {
  if (!events.length) return '<p class="faint">No emails yet.</p>';
  return `<div class="timeline">${events.map((e) => `<div class="ev">
    <span class="ev-icon">${ICON('send')}</span>
    <div class="ev-body">
      <div class="ev-line"><span>You emailed <b>${esc(e.to)}</b></span><time title="${esc(new Date(e.date).toLocaleString())}">${fmtDate(e.date)}</time></div>
      ${e.subject ? `<div class="ev-subject">${esc(e.subject)}</div>` : ''}
    </div></div>`).join('')}</div>`;
}

function renderPanel() {
  const { type, id } = state.record;
  const d = state.data;
  let html;

  if (type === 'company') {
    const c = d.companies.find((x) => x.domain === id);
    if (!c) return closeRecord();
    const ppl = peopleAt(id).sort((a, b) => String(b.lastContact).localeCompare(String(a.lastContact)));
    // Merge each person's emails; one email to several people here shows once.
    const merged = new Map();
    for (const p of ppl) for (const e of p.emails) {
      const k = `${e.date}|${e.subject}`;
      const m = merged.get(k) || { ...e, names: [] };
      m.names.push(p.name || p.email);
      merged.set(k, m);
    }
    const events = [...merged.values()].sort((a, b) => b.date.localeCompare(a.date))
      .map((e) => ({ ...e, to: e.names.length > 2 ? `${e.names[0]} and ${e.names.length - 1} others` : e.names.join(' and ') }));
    const b = bucketOf(c.lastContact);
    html = `
      <div class="panel-top"><span class="crumb">${ICON('building')}Companies</span>
        <button class="icon-btn" data-close aria-label="Close">${ICON('x')}</button></div>
      <div class="panel-body">
        <div class="rec-head">${logo(c.domain, 'lg')}<div><h2>${esc(c.domain)}</h2><p><span class="tag ${b}">${BUCKET_TAG[b]}</span></p></div></div>
        <div class="rec-stats">
          <div><b>${c.timesContacted}</b><span>Emails sent</span></div>
          <div><b>${c.people}</b><span>People</span></div>
          <div><b>${ago(c.lastContact) || '—'}</b><span>Last contact</span></div>
        </div>
        <div class="section"><h3>Details</h3><dl class="fields">
          ${field('globe', 'Domain', esc(c.domain))}
          ${field('cal', 'First contact', dateVal(c.firstContact))}
          ${field('clock', 'Last contact', dateVal(c.lastContact, true))}
          ${field('plus', 'Added', dateVal(c.addedAt))}
        </dl></div>
        <div class="section"><h3>${ICON('users')}People<span class="n">${ppl.length}</span></h3>
          ${ppl.map((p) => `<button class="list-row" data-open-person="${esc(p.email)}">${avatar(p)}<span class="who"><span class="name">${esc(displayName(p))}</span> <span class="faint">${p.name ? esc(p.email) : ''}</span></span><span class="meta">${p.timesContacted} sent · ${ago(p.lastContact)}</span></button>`).join('')}
        </div>
        <div class="section"><h3>${ICON('mail')}Activity<span class="n">${events.length}</span></h3>${timeline(events)}</div>
      </div>`;
  } else {
    const p = d.people.find((x) => x.email === id);
    if (!p) return closeRecord();
    const b = bucketOf(p.lastContact);
    html = `
      <div class="panel-top"><span class="crumb">${ICON('user')}People</span>
        <button class="icon-btn" data-close aria-label="Close">${ICON('x')}</button></div>
      <div class="panel-body">
        <div class="rec-head">${avatar(p, 'lg')}<div><h2>${esc(displayName(p))}</h2><p>${p.name ? esc(p.email) : ''}</p></div></div>
        <div class="rec-stats">
          <div><b>${p.timesContacted}</b><span>Emails sent</span></div>
          <div><b>${ago(p.firstContact) || '—'}</b><span>First contact</span></div>
          <div><b>${ago(p.lastContact) || '—'}</b><span>Last contact</span></div>
        </div>
        <div class="section"><h3>Details</h3><dl class="fields">
          ${field('mail', 'Email', `<a href="mailto:${esc(p.email)}" style="color:inherit">${esc(p.email)}</a>`)}
          ${field('building', 'Company', p.company ? `<button class="pill" data-open-company="${esc(p.company)}">${logo(p.company)}${esc(p.company)}</button>` : '<span class="pill plain">Personal</span>')}
          ${field('pulse', 'Activity', `<span class="tag ${b}">${BUCKET_TAG[b]}</span>`)}
          ${field('cal', 'First contact', dateVal(p.firstContact))}
          ${field('clock', 'Last contact', dateVal(p.lastContact, true))}
          ${field('plus', 'Added', dateVal(p.addedAt))}
        </dl></div>
        <div class="section"><h3>${ICON('mail')}Activity<span class="n">${p.emails.length}</span></h3>
          ${timeline(p.emails.map((e) => ({ ...e, to: displayName(p) })))}</div>
      </div>`;
  }
  $('panel').innerHTML = html;
}

/* Data */

async function load() {
  state.data = await (await fetch('/api/data')).json();
  render();
}

async function sync() {
  state.data.syncing = true;
  renderStatus();
  state.data = await (await fetch('/api/sync', { method: 'POST' })).json();
  render();
}

/* Events */

document.addEventListener('click', (e) => {
  const t = e.target;
  const view = t.closest('[data-view]');
  if (view) { state.view = view.dataset.view; state.bucket = 'all'; return render(); }
  const bucket = t.closest('[data-bucket]');
  if (bucket) { state.bucket = bucket.dataset.bucket; return render(); }
  const sort = t.closest('[data-sort]');
  if (sort) {
    const key = sort.dataset.sort;
    state.sort = { key, dir: state.sort.key === key ? -state.sort.dir : (['domain', 'name', 'email', 'company'].includes(key) ? 1 : -1) };
    return render();
  }
  if (t.closest('#sort-chip')) { state.sort = { key: 'lastContact', dir: -1 }; return render(); }
  const row = t.closest('tbody tr[data-id]');
  if (row) return openRecord(state.view === 'companies' ? 'company' : 'person', row.dataset.id);
  const person = t.closest('[data-open-person]');
  if (person) return openRecord('person', person.dataset.openPerson);
  const company = t.closest('[data-open-company]');
  if (company) return openRecord('company', company.dataset.openCompany);
  if (t.closest('[data-close]') || t === $('scrim')) return closeRecord();
});

document.addEventListener('keydown', (e) => {
  if (e.key === 'Escape' && state.record) return closeRecord();
  if (e.key === '/' && document.activeElement !== $('q')) { e.preventDefault(); $('q').focus(); return; }
  if ((e.key === 'Enter' || e.key === ' ') && e.target.matches('tbody tr[data-id]')) { e.preventDefault(); e.target.click(); }
  if ((e.key === 'ArrowDown' || e.key === 'ArrowUp') && e.target.matches('tbody tr[data-id]')) {
    e.preventDefault();
    (e.key === 'ArrowDown' ? e.target.nextElementSibling : e.target.previousElementSibling)?.focus();
  }
});

$('q').addEventListener('input', (e) => { state.q = e.target.value; render(); });
$('nav-search').addEventListener('click', () => $('q').focus());
$('sync').addEventListener('click', sync);
$('sync2').addEventListener('click', sync);

load();
// The server syncs on its own; refresh every minute to pick that up.
setInterval(() => { if (!state.data?.syncing) load(); }, 60000);
</script>
</body>
</html>
