<title>Trellis Revenue Memory</title>
<meta name="description" content="Clickable demo of the Revenue Memory & Intent Platform: intent queue, prospect timeline, cited answers, governed actions.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans+Condensed:wght@500;600&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<style>
:root{
  --bg:#F2F4F3; --surface:#FFFFFF; --surface-2:#EBEFED; --ink:#16201D; --ink-2:#4B5A55; --ink-3:#74827D;
  --line:#D8DFDC; --line-2:#C5CFCB;
  --accent:#0E6B5A; --accent-ink:#FFFFFF; --accent-soft:#DCEEE9;
  --heat:#B85F00; --heat-soft:#FBE9D2;
  --good:#1B7A48; --good-soft:#DCF0E3; --warn:#9A5B00; --warn-soft:#FAEED8; --crit:#B3261A; --crit-soft:#FBE0DC;
  --ch-email:#2F66C9; --ch-meeting:#7B4FC0; --ch-web:#B85F00; --ch-crm:#0E6B5A;
  --shadow:0 1px 2px rgba(22,32,29,.06),0 8px 24px rgba(22,32,29,.08);
  --scrim:rgba(14,22,19,.38);
  --sans:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --cond:"IBM Plex Sans Condensed","IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    color-scheme:dark;
    --bg:#0E1412; --surface:#151D1A; --surface-2:#1C2623; --ink:#E4EBE8; --ink-2:#A6B4AF; --ink-3:#7D8B86;
    --line:#26322E; --line-2:#34423D;
    --accent:#53C4AA; --accent-ink:#05231C; --accent-soft:#16382F;
    --heat:#F2A34A; --heat-soft:#3A2911;
    --good:#5DCB8D; --good-soft:#163424; --warn:#E6B25B; --warn-soft:#382B12; --crit:#F27B6F; --crit-soft:#3C1C18;
    --ch-email:#7EA6F0; --ch-meeting:#B597EA; --ch-web:#F2A34A; --ch-crm:#53C4AA;
    --shadow:0 1px 2px rgba(0,0,0,.4),0 10px 28px rgba(0,0,0,.45);
    --scrim:rgba(0,0,0,.55);
  }
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --bg:#0E1412; --surface:#151D1A; --surface-2:#1C2623; --ink:#E4EBE8; --ink-2:#A6B4AF; --ink-3:#7D8B86;
  --line:#26322E; --line-2:#34423D;
  --accent:#53C4AA; --accent-ink:#05231C; --accent-soft:#16382F;
  --heat:#F2A34A; --heat-soft:#3A2911;
  --good:#5DCB8D; --good-soft:#163424; --warn:#E6B25B; --warn-soft:#382B12; --crit:#F27B6F; --crit-soft:#3C1C18;
  --ch-email:#7EA6F0; --ch-meeting:#B597EA; --ch-web:#F2A34A; --ch-crm:#53C4AA;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 10px 28px rgba(0,0,0,.45);
  --scrim:rgba(0,0,0,.55);
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.5 var(--sans);-webkit-font-smoothing:antialiased}
button,input,textarea{font:inherit;color:inherit}
button{cursor:pointer}
a{color:var(--accent)}
code,.mono{font-family:var(--mono);font-size:12px}
h1,h2,h3{font-family:var(--cond);font-weight:600;letter-spacing:-.005em;text-wrap:balance;margin:0}
h1{font-size:26px;line-height:1.15}
h2{font-size:19px;line-height:1.25}
h3{font-size:15px;line-height:1.3}
p{margin:0}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.eyebrow{font:500 11px/1.2 var(--mono);text-transform:uppercase;letter-spacing:.08em;color:var(--ink-3)}
.muted{color:var(--ink-2)}
.faint{color:var(--ink-3)}
.num{font-variant-numeric:tabular-nums}

/* Shell */
.app{display:grid;grid-template-columns:228px minmax(0,1fr);min-height:100%}
.rail{position:sticky;top:0;height:100vh;display:flex;flex-direction:column;gap:22px;padding:20px 12px;background:var(--surface);border-right:1px solid var(--line)}
.brand{display:flex;align-items:center;gap:10px;padding:0 8px}
.brand-mark{width:26px;height:26px;border-radius:6px;background:var(--accent);display:grid;place-items:center;flex:none}
.brand-mark svg{display:block}
.brand b{font:600 16px/1 var(--cond)}
.brand small{display:block;font:400 11px/1.3 var(--mono);color:var(--ink-3);margin-top:3px}
.nav{display:flex;flex-direction:column;gap:2px}
.nav a{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:8px 10px;border-radius:6px;color:var(--ink-2);text-decoration:none;font-weight:500;white-space:nowrap}
.nav a:hover{background:var(--surface-2);color:var(--ink)}
.nav a[aria-current="page"]{background:var(--accent-soft);color:var(--ink)}
.nav .count{font:500 11px/1 var(--mono);padding:3px 6px;border-radius:10px;background:var(--heat-soft);color:var(--heat)}
.rail-foot{margin-top:auto;display:flex;flex-direction:column;gap:10px;padding:0 8px;font-size:12px;color:var(--ink-3)}
.rail-foot button{background:none;border:0;padding:0;color:var(--ink-2);text-decoration:underline;text-underline-offset:2px;text-align:left}
.loop{display:flex;flex-wrap:wrap;gap:4px;font:400 11px/1.4 var(--mono)}
.loop span:not(:last-child)::after{content:"→";margin-left:4px;color:var(--ink-3)}

.main{min-width:0;padding-inline:28px;padding-block:0 56px}
.topbar{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;display:flex;align-items:center;gap:12px;padding-block:14px;background:var(--bg);border-bottom:1px solid var(--line);margin-bottom:24px}
.ask-form{flex:1;max-width:620px;display:flex;align-items:center;gap:8px;background:var(--surface);border:1px solid var(--line-2);border-radius:8px;padding:0 6px 0 12px}
.ask-form:focus-within{border-color:var(--accent)}
.ask-form input{flex:1;min-width:0;border:0;background:none;padding:9px 0;outline:none}
.ask-form kbd{font:400 11px var(--mono);color:var(--ink-3);border:1px solid var(--line);border-radius:4px;padding:1px 5px}
.topbar .spacer{flex:1}
.me{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--ink-2);white-space:nowrap}
.avatar{width:28px;height:28px;border-radius:50%;display:grid;place-items:center;font:600 11px/1 var(--sans);background:var(--surface-2);color:var(--ink-2);border:1px solid var(--line);flex:none}

/* Controls */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;padding:7px 12px;border-radius:6px;border:1px solid var(--line-2);background:var(--surface);font-weight:500;font-size:13px;line-height:1.3;white-space:nowrap}
.btn:hover{border-color:var(--ink-3)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.primary:hover{filter:brightness(1.07)}
.btn.ghost{background:none;border-color:transparent;color:var(--ink-2)}
.btn.ghost:hover{background:var(--surface-2);color:var(--ink)}
.btn.live{border-color:var(--heat);color:var(--heat);background:var(--heat-soft)}
.btn:disabled{opacity:.5;cursor:not-allowed;filter:none}
.btn-row{display:flex;flex-wrap:wrap;gap:8px}
.pill{display:inline-flex;align-items:center;gap:5px;padding:2px 8px;border-radius:10px;font:500 11px/1.6 var(--mono);white-space:nowrap;background:var(--surface-2);color:var(--ink-2)}
.pill.good{background:var(--good-soft);color:var(--good)}
.pill.warn{background:var(--warn-soft);color:var(--warn)}
.pill.crit{background:var(--crit-soft);color:var(--crit)}
.pill.heat{background:var(--heat-soft);color:var(--heat)}
.pill.accent{background:var(--accent-soft);color:var(--accent)}
.dot{width:8px;height:8px;border-radius:50%;display:inline-block;flex:none}
.chip{display:inline-flex;align-items:center;gap:6px;padding:4px 10px;border:1px solid var(--line-2);border-radius:14px;background:var(--surface);font-size:12px;font-weight:500;color:var(--ink-2)}
.chip:hover{color:var(--ink);border-color:var(--ink-3)}
.chip[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:var(--bg)}
.chip .n{font:400 11px var(--mono);opacity:.75}
.evchip{display:inline-flex;align-items:center;gap:5px;padding:1px 7px;border-radius:4px;border:1px solid var(--line);background:var(--surface-2);font:400 11px/1.6 var(--mono);color:var(--ink-2)}
.evchip:hover{border-color:var(--accent);color:var(--accent)}
.link{background:none;border:0;padding:0;color:var(--accent);font-weight:500;text-decoration:underline;text-underline-offset:2px}

.panel{background:var(--surface);border:1px solid var(--line);border-radius:10px}
.panel-pad{padding:20px}
.page-head{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:8px 24px;margin-bottom:20px}
.page-head .eyebrow{margin-bottom:6px}
.head-meta{color:var(--ink-3);font-size:13px}
.section-label{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:12px}

/* Queue */
.queue{display:grid;grid-template-columns:minmax(280px,380px) minmax(0,1fr);gap:20px;align-items:start}
.sig-list{display:flex;flex-direction:column;gap:6px}
.list-label{margin:14px 0 2px;font:500 11px/1 var(--mono);text-transform:uppercase;letter-spacing:.08em;color:var(--ink-3)}
.sig{display:grid;grid-template-columns:48px minmax(0,1fr) auto;gap:12px;align-items:center;text-align:left;padding:12px;border:1px solid var(--line);border-radius:8px;background:var(--surface)}
.sig:hover{border-color:var(--line-2)}
.sig.is-sel{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent)}
.sig.is-done{background:transparent}
.sig.is-done .sig-title{color:var(--ink-2)}
.sig.is-new{animation:arrive 1.6s ease-out}
@keyframes arrive{0%{background:var(--heat-soft)}100%{background:var(--surface)}}
.sig-score{display:flex;flex-direction:column;gap:5px}
.sig-score b{font:600 20px/1 var(--cond);font-variant-numeric:tabular-nums;color:var(--heat)}
.sig.is-done .sig-score b{color:var(--ink-3)}
.meter{height:4px;border-radius:2px;background:var(--surface-2);overflow:hidden}
.meter i{display:block;height:100%;width:calc(var(--v) * 1%);background:var(--heat);border-radius:2px}
.sig.is-done .meter i{background:var(--ink-3)}
.sig-main{min-width:0;display:flex;flex-direction:column;gap:2px}
.sig-title{font-weight:600;line-height:1.3}
.sig-sub{font-size:12px;color:var(--ink-2);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sig-meta{display:flex;flex-direction:column;align-items:flex-end;gap:4px;font:400 11px/1.2 var(--mono);color:var(--ink-3);white-space:nowrap}

.detail{padding:24px;display:flex;flex-direction:column;gap:24px;scroll-margin-top:84px}
.detail-head{display:flex;flex-wrap:wrap;justify-content:space-between;gap:16px}
.detail-head > div:first-child{flex:1 1 300px;min-width:0}
.detail-head h2{font-size:24px;margin:6px 0 6px}
.who{display:flex;flex-wrap:wrap;align-items:center;gap:6px 10px;color:var(--ink-2);font-size:13px}
.strength{text-align:right}
.strength b{font:600 44px/1 var(--cond);color:var(--heat);font-variant-numeric:tabular-nums}
.strength span{font:400 13px var(--mono);color:var(--ink-3)}
.strength .meter{width:140px;margin-top:8px;margin-left:auto;height:6px}
.score-rows{display:flex;flex-direction:column;border-top:1px solid var(--line)}
.score-row{display:grid;grid-template-columns:minmax(0,1fr) auto 52px;gap:12px;align-items:center;padding:10px 0;border-bottom:1px solid var(--line)}
.score-row .evs{display:flex;flex-wrap:wrap;gap:4px}
.score-row .pts{font:500 13px var(--mono);text-align:right;color:var(--heat);font-variant-numeric:tabular-nums}
.score-row.excluded .lbl{text-decoration:line-through;color:var(--ink-3)}
.score-row.excluded .pts{color:var(--ink-3)}
.score-row .why{grid-column:1/-1;font-size:12px;color:var(--ink-3);margin-top:-4px}
.score-total{display:flex;justify-content:space-between;padding-top:10px;font:500 13px var(--mono)}
.rec{border-radius:8px;background:var(--accent-soft);padding:16px;display:flex;flex-direction:column;gap:12px}
.rec p{font-size:15px}
.rec.locked{background:var(--warn-soft)}
.rec.done{background:var(--surface-2)}
.note-line{display:flex;gap:8px;align-items:flex-start;font-size:13px;color:var(--ink-2)}
.note-line svg{flex:none;margin-top:2px}
.reasons{display:flex;flex-wrap:wrap;gap:6px;align-items:center}

/* Account */
.crumbs{font-size:13px;color:var(--ink-3);margin-bottom:8px}
.crumbs a{color:var(--ink-2)}
.acct-head{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:flex-end;gap:12px 24px;margin-bottom:20px}
.acct-head .sub{color:var(--ink-2);margin-top:6px;font-size:13px}
.acct-grid{display:grid;grid-template-columns:minmax(0,1fr) 320px;gap:20px;align-items:start}
.stack{display:flex;flex-direction:column;gap:20px}
.summary-list{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:10px}
.summary-list li{display:flex;gap:10px;line-height:1.55}
.summary-list li::before{content:"";width:5px;height:5px;border-radius:50%;background:var(--ink-3);margin-top:9px;flex:none}
.cite{display:inline-block;vertical-align:super;font:500 10px/1 var(--mono);padding:2px 4px;margin-left:2px;border-radius:3px;border:0;background:var(--accent-soft);color:var(--accent)}
.cite:hover{background:var(--accent);color:var(--accent-ink)}
.filters{display:flex;flex-wrap:wrap;gap:6px}
.timeline{list-style:none;margin:0;padding:0}
.day{font:500 11px/1 var(--mono);text-transform:uppercase;letter-spacing:.08em;color:var(--ink-3);padding:16px 0 6px}
.ev{position:relative}
.ev button{width:100%;display:grid;grid-template-columns:88px 14px minmax(0,1fr);gap:10px;align-items:start;text-align:left;border:0;background:none;padding:10px 8px;border-radius:6px}
.ev button:hover{background:var(--surface-2)}
.ev-time{font:400 12px/1.6 var(--mono);color:var(--ink-3);font-variant-numeric:tabular-nums}
.ev-rail{position:relative;align-self:stretch;display:flex;justify-content:center}
.ev-rail::before{content:"";position:absolute;top:0;bottom:-20px;width:1px;background:var(--line)}
.ev:last-child .ev-rail::before{display:none}
.ev-rail .dot{position:relative;margin-top:6px;box-shadow:0 0 0 3px var(--surface)}
.ev-body{display:flex;flex-direction:column;gap:3px;min-width:0}
.ev-line{display:flex;flex-wrap:wrap;align-items:baseline;gap:4px 8px}
.ev-ch{font:500 11px/1 var(--mono);text-transform:uppercase;letter-spacing:.06em}
.ev-meta{color:var(--ink-2);font-size:13px}
.ev-sub{font-size:12px;color:var(--ink-3);display:flex;flex-wrap:wrap;gap:4px 10px}
.ev.is-new button{animation:arrive 1.6s ease-out}
.kv{display:grid;grid-template-columns:auto minmax(0,1fr);gap:8px 16px;margin:0;font-size:13px}
.kv dt{color:var(--ink-3)}
.kv dd{margin:0;min-width:0;overflow-wrap:anywhere}
.stages{display:grid;grid-template-columns:repeat(4,1fr);gap:4px;margin:12px 0 4px}
.stages span{height:6px;border-radius:3px;background:var(--surface-2)}
.stages span.on{background:var(--accent)}
.stage-labels{display:grid;grid-template-columns:repeat(4,1fr);gap:4px;font:400 10px/1.3 var(--mono);color:var(--ink-3)}
.stage-labels .on{color:var(--ink)}
.people{list-style:none;margin:0;padding:0;display:flex;flex-direction:column}
.people li{display:flex;gap:10px;align-items:flex-start;padding:10px 0;border-top:1px solid var(--line)}
.people li:first-child{border-top:0;padding-top:0}
.people .p-main{flex:1;min-width:0;display:flex;flex-direction:column;gap:3px}
.people .p-name{font-weight:600}
.people .p-sub{font-size:12px;color:var(--ink-2)}

/* Tables */
.table-wrap{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:13px}
th{text-align:left;font:500 11px/1.2 var(--mono);text-transform:uppercase;letter-spacing:.06em;color:var(--ink-3);padding:10px 12px;border-bottom:1px solid var(--line);white-space:nowrap}
td{padding:12px;border-bottom:1px solid var(--line);vertical-align:top}
tr:last-child td{border-bottom:0}
tbody tr.row-link{cursor:pointer}
tbody tr.row-link:hover td{background:var(--surface-2)}
td.num,th.num{text-align:right;font-variant-numeric:tabular-nums}

/* Ask */
.ask-wrap{max-width:860px}
.ask-big{display:flex;gap:8px;margin-bottom:12px}
.ask-big input{flex:1;min-width:0;padding:11px 14px;border:1px solid var(--line-2);border-radius:8px;background:var(--surface);font-size:15px}
.ask-big input:focus{outline:none;border-color:var(--accent)}
.suggest{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:24px}
.thread{display:flex;flex-direction:column;gap:16px}
.answer{padding:22px;display:flex;flex-direction:column;gap:16px}
.answer .q{font:600 18px/1.35 var(--cond)}
.answer .scope{font:400 11px/1.5 var(--mono);color:var(--ink-3)}
.answer .block h3{font:500 11px/1 var(--mono);text-transform:uppercase;letter-spacing:.08em;color:var(--ink-3);margin-bottom:8px}
.answer .block p{max-width:68ch;line-height:1.65;margin-bottom:6px;font-size:15px}
.gap{background:var(--warn-soft);border-radius:6px;padding:8px 10px}
.gap .pill{margin-right:6px}
.sources{border-top:1px solid var(--line);padding-top:14px;display:flex;flex-direction:column;gap:6px}
.source{display:grid;grid-template-columns:28px minmax(0,1fr) auto;gap:8px;align-items:baseline;text-align:left;background:none;border:0;padding:4px 6px;border-radius:4px;font-size:13px}
.source:hover{background:var(--surface-2)}
.source .n{font:500 11px var(--mono);color:var(--accent)}
.thinking{display:flex;align-items:center;gap:10px;color:var(--ink-3);font:400 12px var(--mono)}
.thinking i{width:8px;height:8px;border-radius:50%;background:var(--accent);animation:pulse 1s ease-in-out infinite}
@keyframes pulse{50%{opacity:.25}}

/* Rules */
.banner{display:flex;gap:12px;align-items:flex-start;padding:14px 16px;border-radius:8px;background:var(--surface-2);margin-bottom:20px;font-size:13px}
.rules{display:flex;flex-direction:column;gap:14px}
.rule{padding:20px;display:flex;flex-direction:column;gap:14px}
.rule-head{display:flex;flex-wrap:wrap;justify-content:space-between;gap:10px;align-items:flex-start}
.rule-head h3{font-size:17px;margin-bottom:4px}
.logic{display:grid;grid-template-columns:52px minmax(0,1fr);gap:6px 12px;font-size:13px}
.logic dt{font:500 11px/1.9 var(--mono);text-transform:uppercase;letter-spacing:.06em;color:var(--ink-3)}
.logic dd{margin:0;display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.cond{font:400 12px/1.6 var(--mono);background:var(--surface-2);border-radius:4px;padding:1px 7px}
.gov{display:flex;flex-wrap:wrap;gap:6px 16px;font-size:12px;color:var(--ink-3)}
.gov b{color:var(--ink-2);font-weight:500}
.test-out{border-top:1px dashed var(--line-2);padding-top:14px;display:flex;flex-direction:column;gap:10px}
.funnel{display:flex;flex-direction:column;gap:6px;font-size:13px}
.funnel-row{display:grid;grid-template-columns:minmax(0,190px) minmax(0,1fr) 36px;gap:10px;align-items:center}
.funnel-row .bar{height:8px;border-radius:4px;background:var(--surface-2);overflow:hidden}
.funnel-row .bar i{display:block;height:100%;background:var(--accent)}
.funnel-row.block .bar i{background:var(--crit)}
.funnel-row .v{font:500 12px var(--mono);text-align:right;font-variant-numeric:tabular-nums}
.toggle{display:inline-flex;border:1px solid var(--line-2);border-radius:6px;overflow:hidden}
.toggle button{border:0;background:var(--surface);padding:5px 10px;font-size:12px;font-weight:500;color:var(--ink-2)}
.toggle button[aria-pressed="true"]{background:var(--ink);color:var(--bg)}

/* Data */
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px;margin-bottom:20px}
.stat{padding:16px}
.stat .v{font:600 26px/1.1 var(--cond);font-variant-numeric:tabular-nums;margin-top:6px}
.stat .t{font-size:12px;color:var(--ink-3);margin-top:4px}
.conn-name{font-weight:600}
.conn-err{margin-top:6px;font-size:12px;color:var(--crit)}
.merge{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin:12px 0}
.merge > div{border:1px solid var(--line);border-radius:8px;padding:12px;font-size:13px}
.merge code{display:block;margin-top:4px;color:var(--ink-2);overflow-wrap:anywhere}

const atOf = ago => new Date(BASE.getTime() - ago * MIN);
const hhmm = d => String(d.getHours()).padStart(2,'0') + ':' + String(d.getMinutes()).padStart(2,'0');

  return d.getDate() + ' ' + MONTHS[d.getMonth()];
}

function sigDetail(s){

      s.rec.kind !== 'task' ? `<button class="btn" data-act="task" data-id="${s.id}" type="button">Create task</button>` : '',
      `<button class="btn ghost" data-act="snooze" data-id="${s.id}" type="button">Snooze 1 day</button>`,
      `<button class="btn ghost" data-act="dismiss" data-id="${s.id}" type="button">Dismiss</button>`

    const reasons = S.dismissing === s.id ? `<div class="reasons"><span class="faint">Why? This tunes scoring.</span>${['Not relevant', 'Already handled', 'Wrong person', 'Bad timing'].map(r => `<button class="chip" data-act="dismissReason" data-id="${s.id}" data-reason="${r}" type="button">${r}</button>`).join('')}</div>` : '';

    </div>
    <div>

      <div class="score-rows">${s.components.map(c => `<div class="score-row ${c.x ? 'excluded' : ''}"><span class="lbl">${esc(c.l)}</span><span class="evs">${c.ev.map(evChip).join('')}</span><span class="pts">${c.x ? '0' : '+' + c.p}</span>${c.x ? `<span class="why">${esc(c.x)}</span>` : ''}</div>`).join('')}</div>

    </div>
    ${action}`;

function matchAnswer(q){
  const s = q.toLowerCase();
  if (/budget|timing|objection|concern|price|cost/.test(s)) return 'budget';
  if (/who|stakeholder|involved|contact|reach/.test(s)) return 'who';
  if (/today|attention|priorit|which accounts|focus/.test(s)) return 'today';
  if (/chang|acme|next|week|happen|update/.test(s)) return 'change';
  return null;
}
function answerHTML(item){
  if (item.pending) return `<article class="panel answer"><p class="q">${esc(item.q)}</p><p class="thinking"><i></i>Searching permitted events · keyword + semantic retrieval</p></article>`;
  const a = item.a;
  const order = [];
  a.blocks.forEach(b => b.s.forEach(x => x.c.forEach(r => { if (!order.includes(r)) order.push(r); })));
  const num = r => order.indexOf(r) + 1;
  const body = a.blocks.map(b => `<div class="block">${b.h ? `<h3>${b.h}</h3>` : ''}${b.s.map(x => `<p class="${x.gap ? 'gap' : ''}">${x.gap ? '<span class="pill warn">Not enough evidence</span>' : ''}${esc(x.t)}${citeList(x.c, num)}</p>`).join('')}</div>`).join('');
  const srcs = order.length ? `<div class="sources"><span class="eyebrow">Sources</span>${order.map((r, i) => { const { id, line } = parseRef(r); const e = ev(id); return `<button class="source" data-act="ev" data-ref="${r}" type="button"><span class="n">[${i + 1}]</span><span>${esc(e.title)}${line ? ` <span class="faint">· line ${line}</span>` : ''}</span><span class="faint mono">${when(e.ago)}</span></button>`; }).join('')}</div>` : '';
  return `<article class="panel answer">

}
function renderAsk(){
  return `<div class="ask-wrap">
    <header class="page-head"><div><p class="eyebrow">Universal query</p><h1>Ask across every relationship</h1></div><p class="head-meta">Every claim links to the email, note, or visit it came from</p></header>

    <div class="thread" id="thread">${S.thread.slice().reverse().map(answerHTML).join('')}</div>

function ask(q, key){
  q = q.trim(); if (!q) return;
  const k = key || matchAnswer(q);
  const a = k ? ANSWERS[k] : { q, scope: 'All accounts (5)', retrieved: 0, sources: 'all connected sources', blocks: [{ h: '', s: [{ t: `Nothing in your permitted data answers “${q}”, so Trellis will not guess. Try naming an account, person, or topic.`, c: [], gap: true }] }] };
  const item = { q, pending: true, a };
  S.thread.push(item);
  go('ask');
  setTimeout(() => { item.pending = false; if (S.view === 'ask') render(); }, 700);
}

    <div class="modal-foot">
      ${blocked ? `<span class="blocked">Blocked by policy. ${esc(p.name)} is on the do-not-contact list.</span>` : '<span class="faint" style="font-size:12px">Approval required: autonomous sends are off.</span>'}
      <div class="btn-row"><button class="btn ghost" data-act="close" type="button">Cancel</button><button class="btn" data-act="saveDraft" data-id="${s.id}" type="button" ${blocked ? 'disabled' : ''}>Save to Gmail drafts</button><button class="btn primary" data-act="approve" data-id="${s.id}" type="button" ${blocked ? 'disabled' : ''}>Approve and send</button></div>
    </div>
  </div></div>`;
  document.getElementById('dBody').focus();
}

/* ---------- Actions ---------- */
function toast(title, sub){
  const t = document.createElement('div'); t.className = 'toast';
  t.innerHTML = `<b>${esc(title)}</b>${sub ? `<span>${esc(sub)}</span>` : ''}`;
  document.getElementById('toasts').appendChild(t);
  setTimeout(() => t.remove(), 4200);
}
function finish(s, result, audit){
  s.status = audit.status || 'done'; s.result = result; S.dismissing = null;
  D.audit.push({ ago: 0, action: audit.action, target: audit.target, trigger: 'Signal: ' + s.title, policy: audit.policy || 'Passed', approver: audit.approver || ME.name, outcome: audit.outcome });
}
function simulate(){
  if (S.simulated) return;
  S.simulated = true;
  const btn = document.getElementById('simBtn'); btn.disabled = true; btn.lastChild.textContent = 'Event received';
  const add = [
    { id: 'm1', acct: 'acme', person: 'marcus', type: 'link.clicked', ago: 0, title: 'Clicked “Security overview”', meta: 'from “Security questionnaire + SOC 2”', src: 'Tracked links', ident: 'Signed link token', conf: 'High',
      body: { kind: 'rows', rows: [['Link', 'Security overview'], ['Destination', 'trellisfleet.example/security'], ['Token', 'lnk_9RT2… (signed, first click binds this browser)'], ['Recipient', 'marcus.lee@acmelogistics.example']] } },
    { id: 'm2', acct: 'acme', person: 'marcus', type: 'page.viewed', ago: 0, title: 'Viewed /trust/soc2', meta: '2 min 48 s', src: 'Web SDK', ident: 'Tracked link', conf: 'High',
      body: { kind: 'rows', rows: [['URL', 'trellisfleet.example/trust/soc2'], ['Referrer', 'trellisfleet.example/security'], ['Time on page', '2 min 48 s'], ['Identity', 'Browser bound by the tracked-link click just now']] } }
  ];
  D.events.push(...add); add.forEach(e => S.newIds.add(e.id));
  toast('New events captured', 'Marcus Lee clicked a tracked link and is reading the SOC 2 page.');
  if (S.view === 'account' && S.acct === 'acme') render();
  setTimeout(() => {
    D.signals.push({ id: 's6', acct: 'acme', person: 'marcus', kind: 'Buying signal', title: 'Security review started', strength: 71, ago: 0, status: 'open',
      components: [
        { l: 'Read the SOC 2 page for almost 3 minutes', p: 30, ev: ['m2'] },
        { l: 'First click from Marcus, via the security email', p: 21, ev: ['m1'] },
        { l: 'Open request for the SOC 2 report', p: 20, ev: ['e4#3'] },
        { l: 'Earlier open of the same email', p: 0, ev: ['e6'], x: 'Excluded. Opens are distorted by privacy proxies and security scanners.' }
      ],
      rec: { kind: 'draft', text: 'Send Marcus the SOC 2 Type II report now, while he is reviewing.' },
      draft: { to: 'marcus', subject: 'SOC 2 Type II report for Acme’s review',
        body: 'Hi Marcus,\n\nAs discussed in yesterday’s check-in, here is our SOC 2 Type II report (period ending 30 Jun 2026) and the completed security questionnaire.\n\nIf it helps, I can set up 30 minutes with our security lead for any follow-ups.\n\nJordan',
        why: [['Marcus asked for the SOC 2 report', 'e4#3'], ['He is reading the SOC 2 page right now', 'm2']] } });
    D.accounts.acme.summary.push({ t: 'Marcus started the security review today and is reading the SOC 2 page.', c: ['m1', 'm2'] });
    D.accounts.acme.summaryAgo = 0;
    S.newIds.add('s6');
    toast('New signal: Security review started', 'Acme Logistics · strength 71 · 1 m 48 s after the click');
    render();
  }, 1400);
}

document.addEventListener('click', e => {
  const t = e.target.closest('[data-act]'); if (!t) return;
  const act = t.dataset.act, id = t.dataset.id;
  const s = id ? D.signals.find(x => x.id === id) : null;
  switch (act){
    case 'sig':
      S.sig = id; S.dismissing = null; S.newIds.delete(id);
      if (S.view !== 'queue') { go('queue'); } else { render(); }
      if (window.innerWidth <= 1100) document.getElementById('detail')?.scrollIntoView({ block: 'start' });
      break;
    case 'ev': e.preventDefault(); openEvidence(t.dataset.ref); break;
    case 'close': closeLayers(); break;
    case 'draft': openDraft(id); break;
    case 'approve': {
      const p = person(s.draft.to), subj = document.getElementById('dSubj').value;
      D.events.push({ id: 'x' + Date.now(), acct: s.acct, person: s.draft.to, type: 'email.sent', ago: 0, title: `Sent “${subj}”`, meta: 'to ' + p.name + ' · approved by you', src: 'Gmail', ident: 'Email address', conf: 'Very high',
        body: { kind: 'email', from: ME.email, to: p.email, subject: subj, text: document.getElementById('dBody').value } });
      finish(s, `Email “${subj}” sent to ${p.name} after your approval. It is on the ${D.accounts[s.acct].name} timeline.`, { action: 'Email sent', target: p.name, policy: 'Passed 5 of 5', outcome: 'Delivered via Gmail' });
      closeLayers(); toast('Sent from your Gmail', `To ${p.name} · logged to the audit trail`); render(); break;
    }
    case 'saveDraft': {
      const p = person(s.draft.to);
      finish(s, `Draft saved to your Gmail drafts for ${p.name}.`, { action: 'Draft saved', target: p.name, outcome: 'In Gmail drafts' });
      closeLayers(); toast('Saved to Gmail drafts', 'Nothing was sent'); render(); break;
    }
    case 'task': {
      const task = s.rec.task || `Follow up: ${s.title}`, due = s.rec.due || 'Tomorrow';
      finish(s, `Task created: “${task}”, due ${due.toLowerCase()}, assigned to ${ME.name}.`, { action: 'Task created', target: D.accounts[s.acct].name, outcome: 'Open · due ' + due.toLowerCase() });
      toast('Task created', task); render(); break;
    }
    case 'notify':
      finish(s, `${ME.name} notified in the app and by email. Outreach to ${person(s.person).name} stays blocked.`, { action: 'Owner notified', target: D.accounts[s.acct].name, policy: 'Passed (internal only)', outcome: 'In-app + email alert' });
      toast('Owner notified', 'Internal alert only. No external message.'); render(); break;
    case 'snooze':
      finish(s, 'Snoozed until tomorrow at 09:00. It returns to the queue if new evidence arrives first.', { action: 'Signal snoozed', target: D.accounts[s.acct].name, outcome: 'Until tomorrow 09:00', status: 'snoozed' });
      render(); break;
    case 'dismiss': S.dismissing = S.dismissing === id ? null : id; render(); break;
    case 'dismissReason':
      finish(s, `Dismissed: ${t.dataset.reason.toLowerCase()}. The reason is logged to improve scoring.`, { action: 'Signal dismissed', target: D.accounts[s.acct].name, outcome: 'Reason: ' + t.dataset.reason.toLowerCase(), status: 'dismissed' });
      render(); break;
    case 'reopen': s.status = 'open'; s.result = ''; render(); break;
    case 'filter': S.filter = t.dataset.f; render(); break;
    case 'goacct': go('acct-' + id); break;
    case 'askAbout': ask(id === 'acme' ? ANSWERS.change.q : `What changed at ${D.accounts[id].name} this week?`, id === 'acme' ? 'change' : null); break;
    case 'preset': ask(ANSWERS[t.dataset.k].q, t.dataset.k); break;
    case 'freeq': ask(t.dataset.q, null); break;
    case 'mode': { const r = D.rules.find(x => x.id === id); r.mode = t.dataset.m; toast(r.mode === 'test' ? 'Rule in test mode' : 'Rule enabled', r.mode === 'test' ? `${r.name} will log matches without acting.` : `${r.name} now creates actions. External email still needs approval.`); render(); break; }
    case 'test': S.testing[id] = true; render(); break;
    case 'reconnect': { const c = D.connectors.find(x => x.id === id); c.status = 'ok'; c.last = 'just now'; c.lag = '12 s'; c.vol = '1,122 events · backfilling the 3-hour gap'; toast('Google Calendar reconnected', 'Backfilling the missed 3 hours. Replays do not create duplicates.'); render(); break; }
    case 'merge': D.mergeOpen = false; toast('Merged into Priya Raman', '145 events on one timeline. You can undo this from her profile.'); render(); break;
    case 'keep': D.mergeOpen = false; toast('Kept separate', 'Trellis will not suggest this pair again.'); render(); break;
    case 'simulate': simulate(); break;
    case 'reset':
      D = structuredClone(INITIAL); Object.assign(S, { sig: 's1', filter: 'all', dismissing: null, simulated: false, testing: {}, thread: [], newIds: new Set() });
      const b = document.getElementById('simBtn'); b.disabled = false; b.lastChild.textContent = 'Simulate live event';
      seedThread(); closeLayers(); go('queue'); toast('Demo reset'); break;
  }
});
document.addEventListener('keydown', e => {
  if (e.key === 'Escape') closeLayers();
  if (e.key === '/' && !/INPUT|TEXTAREA/.test(document.activeElement.tagName)) { e.preventDefault(); document.getElementById('topAskInput').focus(); }
  if (e.key === 'Enter' && e.target.matches('tr.row-link')) e.target.click();
});
document.addEventListener('submit', e => {
  e.preventDefault();
  const input = e.target.querySelector('input');
  if (input && input.value.trim()) { const q = input.value; input.value = ''; ask(q); }
});

/* ---------- Routing ---------- */
function go(hash){ if (location.hash === '#' + hash) route(); else location.hash = hash; }
function route(){
  const h = location.hash.slice(1) || 'queue';
  if (h.startsWith('acct-')) { const id = h.slice(5); if (S.acct !== id) S.filter = 'all'; S.view = 'account'; S.acct = id; }
  else S.view = ['queue', 'accounts', 'ask', 'rules', 'data', 'audit'].includes(h) ? h : 'queue';
  closeLayers(); render(); window.scrollTo(0, 0);
}
function render(){
  const v = document.getElementById('view');
  v.innerHTML = { queue: renderQueue, accounts: renderAccounts, ask: renderAsk, rules: renderRules, data: renderData, audit: renderAudit }[S.view]?.() ?? renderAccount(S.acct);
  renderNav();
}
function seedThread(){ S.thread = [{ q: ANSWERS.change.q, pending: false, a: ANSWERS.change }]; }
seedThread();
window.addEventListener('hashchange', route);
route();
</script>
