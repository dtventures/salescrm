<title>Trellis Revenue Memory</title>
<meta name="description" content="Clickable demo of the Revenue Memory & Intent Platform: who needs attention, why, and what to do next.">
<style>
:root{
  --bg:#FFFFFF; --bg-2:#F4F5F7; --bg-3:#ECEDF0;
  --ink:#111113; --ink-2:#5F6068; --ink-3:#9B9CA4; --line:#E7E8EC;
  --accent:#1A5CFF; --accent-ink:#FFFFFF; --accent-soft:#EAF0FF;
  --good:#1F8F4A; --bad:#D1322D; --caution:#B86E00; --bad-soft:#FDEDEC;
  --glass:rgba(255,255,255,.82);
  --shadow:0 2px 6px rgba(17,17,19,.04),0 18px 48px rgba(17,17,19,.12);
  --scrim:rgba(17,17,19,.28);
  --font:-apple-system,BlinkMacSystemFont,"SF Pro Text","Helvetica Neue","Segoe UI",Roboto,Arial,sans-serif;
  --display:-apple-system,BlinkMacSystemFont,"SF Pro Display","Helvetica Neue","Segoe UI",Roboto,Arial,sans-serif;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    color-scheme:dark;
    --bg:#0B0B0C; --bg-2:#161618; --bg-3:#1F1F22;
    --ink:#F3F3F5; --ink-2:#A3A4AC; --ink-3:#6C6D75; --line:#242428;
    --accent:#4C8DFF; --accent-ink:#FFFFFF; --accent-soft:#16233F;
    --good:#4CC27A; --bad:#FF6961; --caution:#F0A640; --bad-soft:#3A1614;
    --glass:rgba(11,11,12,.8);
    --shadow:0 2px 6px rgba(0,0,0,.4),0 18px 48px rgba(0,0,0,.6);
    --scrim:rgba(0,0,0,.55);
  }
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --bg:#0B0B0C; --bg-2:#161618; --bg-3:#1F1F22;
  --ink:#F3F3F5; --ink-2:#A3A4AC; --ink-3:#6C6D75; --line:#242428;
  --accent:#4C8DFF; --accent-ink:#FFFFFF; --accent-soft:#16233F;
  --good:#4CC27A; --bad:#FF6961; --caution:#F0A640; --bad-soft:#3A1614;
  --glass:rgba(11,11,12,.8);
  --shadow:0 2px 6px rgba(0,0,0,.4),0 18px 48px rgba(0,0,0,.6);
  --scrim:rgba(0,0,0,.55);
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 var(--font);letter-spacing:-.005em;-webkit-font-smoothing:antialiased}
button,input,textarea{font:inherit;color:inherit;letter-spacing:inherit}
button{cursor:pointer;background:none;border:0;padding:0}
a{color:inherit;text-decoration:none}
p{margin:0}
h1,h2,h3{margin:0;font-family:var(--display);font-weight:600;text-wrap:balance}
h1{font-size:44px;line-height:1.08;letter-spacing:-.028em}
h2{font-size:30px;line-height:1.15;letter-spacing:-.022em}
h3{font-size:17px;line-height:1.3;letter-spacing:-.012em}
:focus-visible{outline:2px solid var(--accent);outline-offset:3px;border-radius:6px}
.num{font-variant-numeric:tabular-nums}
.muted{color:var(--ink-2)}
.faint{color:var(--ink-3)}
.label{font-size:13px;font-weight:500;color:var(--ink-3)}

/* Bar */
.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:10;background:var(--glass);-webkit-backdrop-filter:saturate(180%) blur(20px);backdrop-filter:saturate(180%) blur(20px);border-bottom:1px solid var(--line)}
.bar-in{max-width:1120px;margin:0 auto;padding-inline:24px;height:56px;display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:16px}
.mark{font:600 17px/1 var(--display);letter-spacing:-.02em;display:flex;align-items:center;gap:8px}
.mark i{width:9px;height:9px;border-radius:50%;background:var(--accent)}
.tabs{display:flex;gap:4px;background:var(--bg-2);border-radius:999px;padding:3px}
.tabs a{padding:6px 16px;border-radius:999px;font-size:14px;font-weight:500;color:var(--ink-2);white-space:nowrap}
.tabs a:hover{color:var(--ink)}
.tabs a[aria-current="page"]{background:var(--bg);color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.08)}
.bar-right{display:flex;justify-content:flex-end;align-items:center;gap:6px}
.icon-btn{position:relative;width:34px;height:34px;border-radius:50%;display:grid;place-items:center;color:var(--ink-2)}
.icon-btn:hover{background:var(--bg-2);color:var(--ink)}
.icon-btn .alert{position:absolute;top:6px;right:6px;width:7px;height:7px;border-radius:50%;background:var(--bad);box-shadow:0 0 0 2px var(--bg)}
.sim{font-size:13px;font-weight:500;color:var(--accent);padding:6px 10px;border-radius:999px;white-space:nowrap}
.sim:hover{background:var(--accent-soft)}
.sim:disabled{color:var(--ink-3);background:none;cursor:default}
.menu{position:absolute;right:24px;top:52px;width:220px;background:var(--bg);border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow);padding:6px;display:flex;flex-direction:column}
.menu a,.menu button{display:flex;justify-content:space-between;align-items:center;padding:9px 12px;border-radius:8px;font-size:14px;text-align:left}
.menu a:hover,.menu button:hover{background:var(--bg-2)}
.menu hr{border:0;border-top:1px solid var(--line);margin:6px 4px}
.menu .note{padding:6px 12px 8px;font-size:12px;color:var(--ink-3)}
.bar-wrap{position:relative;max-width:1120px;margin:0 auto}

.page{max-width:1120px;margin:0 auto;padding-inline:24px;padding-block:48px 96px}
.hero{margin-bottom:40px}
.hero .date{font-size:15px;font-weight:500;color:var(--ink-3);margin-bottom:8px}
.hero p.sub{font-size:19px;color:var(--ink-2);margin-top:10px;max-width:40ch}

/* Buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;height:40px;padding:0 20px;border-radius:999px;font-size:15px;font-weight:500;white-space:nowrap;background:var(--bg-2);color:var(--ink)}
.btn:hover{background:var(--bg-3)}
.btn.primary{background:var(--accent);color:var(--accent-ink)}
.btn.primary:hover{filter:brightness(1.08)}
.btn:disabled{opacity:.4;cursor:not-allowed;filter:none}
.btn.small{height:32px;padding:0 14px;font-size:13px}
.text-btn{color:var(--accent);font-weight:500;font-size:15px}
.text-btn:hover{text-decoration:underline;text-underline-offset:3px}
.quiet{color:var(--ink-2);font-size:14px;font-weight:500}
.quiet:hover{color:var(--ink)}
.actions{display:flex;flex-wrap:wrap;align-items:center;gap:12px 20px}
.dotc{display:inline-block;width:7px;height:7px;border-radius:50%;margin-right:7px;vertical-align:1px}
.seg{display:inline-flex;background:var(--bg-2);border-radius:999px;padding:3px;gap:2px;flex-wrap:wrap}
.seg button{padding:5px 14px;border-radius:999px;font-size:13px;font-weight:500;color:var(--ink-2)}
.seg button[aria-pressed="true"]{background:var(--bg);color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.08)}
.cite{display:inline-block;vertical-align:super;font-size:10.5px;font-weight:600;line-height:1;color:var(--accent);padding:1px 3px;margin-left:1px;border-radius:4px}
.cite:hover{background:var(--accent-soft)}

/* Today */
.today{display:grid;grid-template-columns:minmax(260px,340px) minmax(0,1fr);gap:48px;align-items:start}
.list{display:flex;flex-direction:column}
.list .group{font-size:13px;font-weight:500;color:var(--ink-3);padding:24px 14px 8px}
.row{display:grid;grid-template-columns:40px minmax(0,1fr);gap:14px;align-items:baseline;text-align:left;padding:16px 14px;border-radius:14px}
.row:hover{background:var(--bg-2)}
.row.sel{background:var(--bg-2)}
.row .n{font:600 22px/1 var(--display);letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.row .who{font-weight:600;display:flex;justify-content:space-between;gap:10px}
.row .who span{font-weight:400;font-size:13px;color:var(--ink-3);white-space:nowrap}
.row .why{color:var(--ink-2);font-size:14px;margin-top:2px}
.row.done .n,.row.done .who{color:var(--ink-3)}
.row.new{animation:glow 2s ease-out}
@keyframes glow{0%{background:var(--accent-soft)}100%{background:transparent}}
.detail{position:sticky;top:96px;display:flex;flex-direction:column;gap:36px;scroll-margin-top:72px}
.detail .ctx{font-size:15px;color:var(--ink-2);margin-bottom:10px}
.detail .ctx a:hover{color:var(--ink)}
.detail h2{font-size:40px;letter-spacing:-.028em}
.score{display:flex;align-items:baseline;gap:14px;margin-top:22px}
.score b{font:300 72px/0.9 var(--display);letter-spacing:-.04em;font-variant-numeric:tabular-nums}
.score span{font-size:14px;color:var(--ink-3);line-height:1.4}
.rec{font-size:22px;line-height:1.4;letter-spacing:-.015em;max-width:30ch;font-family:var(--display)}
.rec-block{display:flex;flex-direction:column;gap:20px}
.lock{font-size:14px;color:var(--caution)}
.outcome{font-size:19px;line-height:1.45;color:var(--ink-2);max-width:40ch}
.reasons{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.reasons .label{margin-right:4px}
.why-list{border-top:1px solid var(--line)}
.why-row{width:100%;display:grid;grid-template-columns:minmax(0,1fr) auto 14px;gap:16px;align-items:baseline;padding:13px 0;border-bottom:1px solid var(--line);text-align:left;font-size:15px}
.why-row .pts{font-variant-numeric:tabular-nums;color:var(--ink-2);font-weight:500}
.why-row .chev{color:var(--ink-3);opacity:0;transition:opacity .15s}
.why-row:hover .chev{opacity:1}
.why-row.x{color:var(--ink-3)}
.why-row.x .lbl{text-decoration:line-through}
.why-row.x .pts{color:var(--ink-3)}
.why-row small{grid-column:1/-1;font-size:13px;color:var(--ink-3);margin-top:-6px}
.disclose{display:flex;align-items:center;gap:6px;color:var(--ink-2);font-size:14px;font-weight:500}
.disclose:hover{color:var(--ink)}
.disclose svg{transition:transform .2s}
.disclose[aria-expanded="true"] svg{transform:rotate(90deg)}

/* Account */
.back{display:inline-flex;align-items:center;gap:4px;color:var(--accent);font-size:15px;margin-bottom:20px}
.acct-sub{font-size:19px;color:var(--ink-2);margin-top:10px}
.facts{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:24px;margin:40px 0 12px}
.fact .v{font:500 26px/1.1 var(--display);letter-spacing:-.02em;font-variant-numeric:tabular-nums;margin-top:6px}
.progress{display:grid;grid-template-columns:repeat(4,1fr);gap:4px;margin-bottom:56px}
.progress i{height:3px;border-radius:2px;background:var(--bg-3)}
.progress i.on{background:var(--ink)}
.progress i.lost{background:var(--bad)}
.memory{max-width:680px;margin-bottom:64px}
.memory p{font-size:21px;line-height:1.55;letter-spacing:-.012em;margin-top:14px;font-family:var(--display)}
.memory .label{display:block}
.acct-cols{display:grid;grid-template-columns:minmax(0,1fr) 280px;gap:64px;align-items:start}
.sec-head{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:center;gap:12px;margin-bottom:12px}
.tl{list-style:none;margin:0;padding:0}
.tl .day{font-size:13px;font-weight:500;color:var(--ink-3);padding:24px 0 6px}
.tl .day:first-child{padding-top:8px}
.tl button{width:100%;display:grid;grid-template-columns:60px minmax(0,1fr);gap:16px;text-align:left;padding:12px 0;border-bottom:1px solid var(--line)}
.tl button:hover .t1{color:var(--accent)}
.tl .tm{font-size:13px;color:var(--ink-3);font-variant-numeric:tabular-nums;padding-top:2px}
.tl .t1{font-weight:500}
.tl .t2{font-size:13px;color:var(--ink-2);margin-top:2px}
.tl .new button{animation:glow 2s ease-out}
.people{list-style:none;margin:0;padding:0}
.people li{padding:14px 0;border-bottom:1px solid var(--line)}
.people li:first-child{padding-top:4px}
.people .nm{font-weight:600}
.people .ds{font-size:13px;color:var(--ink-2);margin-top:2px}
.people .id{font-size:13px;color:var(--ink-3);margin-top:4px}

/* Tables */
.table-wrap{overflow-x:auto}
table{width:100%;border-collapse:collapse}
th{text-align:left;font-size:13px;font-weight:500;color:var(--ink-3);padding:0 16px 12px 0;white-space:nowrap;border-bottom:1px solid var(--line)}
td{padding:18px 16px 18px 0;border-bottom:1px solid var(--line);vertical-align:top}
td.r,th.r{text-align:right}
tr.link{cursor:pointer}
tr.link:hover td:first-child{color:var(--accent)}
td .s{display:block;font-size:13px;color:var(--ink-3);margin-top:2px}

/* Ask */
.ask{max-width:720px;margin:0 auto}
.ask h1{text-align:center;margin-bottom:28px}
.ask-field{display:flex;align-items:center;gap:12px;background:var(--bg-2);border-radius:16px;padding:0 8px 0 20px;border:1px solid transparent}
.ask-field:focus-within{border-color:var(--accent);background:var(--bg)}
.ask-field input{flex:1;min-width:0;border:0;background:none;outline:none;padding:16px 0;font-size:19px}
.ask-field svg{color:var(--ink-3);flex:none}
.try{display:flex;flex-direction:column;align-items:flex-start;gap:8px;margin:20px 0 56px 20px}
.try button{color:var(--accent);font-size:15px;text-align:left}
.try button:hover{text-decoration:underline;text-underline-offset:3px}
.thread{display:flex;flex-direction:column;gap:64px}
.ans .q{font:600 26px/1.25 var(--display);letter-spacing:-.02em}
.ans .scope{font-size:13px;color:var(--ink-3);margin:8px 0 24px}
.ans h3{font-size:13px;font-weight:500;color:var(--ink-3);margin:24px 0 6px;font-family:var(--font);letter-spacing:0}
.ans .body p{font-size:18px;line-height:1.6;margin-bottom:8px;letter-spacing:-.01em}
.ans .gap{color:var(--ink-2)}
.ans .gap::before{content:"Not enough evidence. ";font-weight:600;color:var(--caution)}
.srcs{margin-top:28px;padding-top:16px;border-top:1px solid var(--line);display:flex;flex-direction:column}
.srcs button{display:grid;grid-template-columns:24px minmax(0,1fr) auto;gap:10px;text-align:left;padding:7px 0;font-size:14px;color:var(--ink-2)}
.srcs button:hover{color:var(--ink)}
.srcs .i{color:var(--accent);font-weight:600;font-size:13px}
.thinking{color:var(--ink-3);font-size:15px;display:flex;align-items:center;gap:10px}
.thinking i{width:7px;height:7px;border-radius:50%;background:var(--accent);animation:pulse 1s ease-in-out infinite}
@keyframes pulse{50%{opacity:.2}}

/* Settings pages */
.stack{display:flex;flex-direction:column}
.item{padding:28px 0;border-bottom:1px solid var(--line);display:flex;flex-direction:column;gap:12px}
.item:first-child{border-top:1px solid var(--line)}
.item-head{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:center;gap:12px}
.item h3{font-size:20px}
.item .sentence{font-size:16px;color:var(--ink-2);line-height:1.6;max-width:70ch}
.item .sentence b{color:var(--ink);font-weight:500}
.results{display:flex;flex-wrap:wrap;gap:12px 40px;margin-top:4px}
.results div{display:flex;flex-direction:column}
.results .v{font:500 24px/1.1 var(--display);font-variant-numeric:tabular-nums}
.results .v.bad{color:var(--bad)}
.results .l{font-size:13px;color:var(--ink-3);margin-top:4px}
.note-line{font-size:14px;color:var(--ink-2);max-width:70ch}
.big-stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:24px;margin-bottom:56px}
.big-stats .v{font:300 44px/1 var(--display);letter-spacing:-.03em;font-variant-numeric:tabular-nums;margin:8px 0 6px}
.big-stats .l{font-size:13px;color:var(--ink-3)}
.err{color:var(--bad);font-size:14px}
.split{display:grid;grid-template-columns:1fr 1fr;gap:64px;margin-top:64px}
.pair{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin:16px 0}
.pair div{background:var(--bg-2);border-radius:12px;padding:14px;font-size:14px}
.pair span{display:block;color:var(--ink-3);font-size:13px;overflow-wrap:anywhere;margin-top:2px}
dl.kv{display:grid;grid-template-columns:auto minmax(0,1fr);gap:10px 24px;margin:16px 0 0;font-size:15px}
dl.kv dt{color:var(--ink-3)}
dl.kv dd{margin:0;overflow-wrap:anywhere}

/* Sheets */
.scrim{position:fixed;inset:0;background:var(--scrim);z-index:20;animation:fade .2s ease-out}
@keyframes fade{from{opacity:0}}
.sheet{position:fixed;top:0;right:0;bottom:0;z-index:21;width:min(500px,100%);background:var(--bg);box-shadow:var(--shadow);display:flex;flex-direction:column;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);animation:slide .28s cubic-bezier(.2,.8,.2,1)}
@keyframes slide{from{transform:translateX(24px);opacity:0}}
.sheet-head{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:16px 24px}
.sheet-body{overflow:auto;padding:8px 32px 40px;display:flex;flex-direction:column;gap:28px}
.pager{display:flex;align-items:center;gap:4px;font-size:13px;color:var(--ink-3)}
.src{font-size:15px;line-height:1.65}
.src .hdr{display:grid;grid-template-columns:auto minmax(0,1fr);gap:4px 16px;font-size:14px;padding-bottom:14px;margin-bottom:14px;border-bottom:1px solid var(--line)}
.src .hdr span:nth-child(odd){color:var(--ink-3)}
.src .txt{white-space:pre-wrap}
.lines{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:4px}
.lines li{padding:8px 12px;border-radius:10px;color:var(--ink-2)}
.lines li.hit{background:var(--accent-soft);color:var(--ink)}
.weak{font-size:14px;color:var(--caution)}
pre.env{margin:12px 0 0;padding:16px;background:var(--bg-2);border-radius:12px;overflow:auto;font:12px/1.6 ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;color:var(--ink-2)}

.modal-wrap{position:fixed;inset:0;z-index:30;display:flex;align-items:flex-start;justify-content:center;padding:max(40px,env(safe-area-inset-top,0px)) 16px 24px;overflow:auto}
.modal{position:relative;z-index:31;width:min(640px,100%);background:var(--bg);border-radius:20px;box-shadow:var(--shadow);animation:pop .25s cubic-bezier(.2,.8,.2,1)}
@keyframes pop{from{transform:scale(.98);opacity:0}}
.modal-head{display:flex;justify-content:space-between;align-items:center;padding:18px 24px 0}
.compose{padding:8px 28px 0}
.field{display:grid;grid-template-columns:70px minmax(0,1fr);align-items:center;gap:8px;border-bottom:1px solid var(--line);padding:12px 0;font-size:15px}
.field label{color:var(--ink-3)}
.field input{border:0;background:none;outline:none;min-width:0}
.compose textarea{width:100%;min-height:280px;border:0;outline:none;resize:vertical;background:none;padding:18px 0;font-size:16px;line-height:1.65}
.modal-info{margin:0 28px;padding:16px 0;border-top:1px solid var(--line);display:flex;flex-direction:column;gap:10px;font-size:14px}
.checks{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px;color:var(--ink-2)}
.checks b{color:var(--ink);font-weight:500}
.checks .fail b{color:var(--bad)}
.modal-foot{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:center;gap:12px;padding:16px 24px 20px}
.ok{color:var(--good)}
.no{color:var(--bad)}

.toasts{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(24px + env(safe-area-inset-bottom,0px));z-index:40;display:flex;flex-direction:column;align-items:center;gap:8px;width:min(440px,calc(100% - 32px))}
.toast{background:var(--ink);color:var(--bg);border-radius:14px;padding:12px 18px;box-shadow:var(--shadow);font-size:14px;text-align:center;animation:rise .3s cubic-bezier(.2,.8,.2,1)}
.toast span{opacity:.7}
@keyframes rise{from{transform:translateY(10px);opacity:0}}
.empty{color:var(--ink-3);padding:24px 0}

@media (max-width:980px){
  .today{grid-template-columns:1fr;gap:32px}
  .detail{position:static}
  .acct-cols,.split{grid-template-columns:1fr;gap:48px}
}
@media (max-width:720px){
  .bar-in{grid-template-columns:auto 1fr auto;padding-inline:16px;gap:10px}
  .tabs{justify-self:center}
  .tabs a{padding:6px 11px}
  .mark span{display:none}
  .sim span{display:none}
  .menu{right:16px}
  .page{padding-inline:16px;padding-block:32px 80px}
  h1{font-size:34px}
  .detail h2{font-size:32px}
  .facts,.big-stats{grid-template-columns:repeat(2,minmax(0,1fr))}
  .memory p{font-size:18px}
  .sheet-body{padding:8px 20px 32px}
  .compose{padding:8px 20px 0}
  .modal-info{margin:0 20px}
  .pair{grid-template-columns:1fr}
  .try{margin-left:4px}
}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}
</style>

<header class="bar">
  <div class="bar-in">
    <a class="mark" href="#queue"><i></i><span>Trellis</span></a>

  const d = atOf(ago), b = new Date(BASE); b.setHours(0,0,0,0);

  if (diff < 7) return DAYS[d.getDay()] + ' ' + d.getDate() + ' ' + MONTHS[d.getMonth()];

}

function matchAnswer(q){
  const s = q.toLowerCase();
  if (/budget|timing|objection|concern|price|cost/.test(s)) return 'budget';
  if (/who|stakeholder|involved|contact|reach/.test(s)) return 'who';
  if (/today|attention|priorit|which accounts|focus/.test(s)) return 'today';
  if (/chang|acme|next|week|happen|update/.test(s)) return 'change';
  return null;
}
function answerHTML(item){
  if (item.pending) return `<article class="ans"><p class="q">${esc(item.q)}</p><p class="thinking" style="margin-top:16px"><i></i>Reading your email, notes, and site activity…</p></article>`;
  const a = item.a, order = [];
  a.blocks.forEach(b => b.s.forEach(x => x.c.forEach(r => { if (!order.includes(r)) order.push(r); })));
  const num = r => order.indexOf(r) + 1;
  return `<article class="ans">
    <p class="q">${esc(item.q)}</p>
    <p class="scope">${esc(a.scope)} · ${a.retrieved} sources checked</p>
    <div class="body">${a.blocks.map(b => `${b.h ? `<h3>${b.h}</h3>` : ''}${b.s.map(x => `<p class="${x.gap ? 'gap' : ''}">${esc(x.t)}${cites(x.c, num)}</p>`).join('')}`).join('')}</div>
    ${a.action ? `<div class="actions" style="margin-top:24px"><button class="btn primary" data-act="${a.action.act}" data-id="${a.action.id}" type="button">${a.action.label}</button></div>` : ''}
    ${order.length ? `<div class="srcs">${order.map((r, i) => { const { id, line } = parseRef(r); const e = ev(id); return `<button data-act="ev" data-refs="${order.join(',')}" data-ref="${r}" type="button"><span class="i">${i + 1}</span><span>${esc(e.title)}${line ? ' · line ' + line : ''}</span><span class="faint">${when(e.ago)}</span></button>`; }).join('')}</div>` : ''}
  </article>`;
}
function renderAsk(){
  return `<div class="ask">
    <h1>Ask anything.</h1>
    <form id="askForm" class="ask-field"><svg width="20" height="20" viewBox="0 0 20 20" fill="none" aria-hidden="true"><circle cx="9" cy="9" r="6" stroke="currentColor" stroke-width="1.7"/><path d="m14 14 4 4" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/></svg><input id="askInput" type="text" placeholder="What did Acme say about budget?" aria-label="Question" autocomplete="off"></form>

function ask(q, key){
  q = q.trim(); if (!q) return;
  const k = key || matchAnswer(q);
  const a = k ? ANSWERS[k] : { q, scope: 'All accounts', retrieved: 0, blocks: [{ h: '', s: [{ t: `Nothing in your data answers “${q}”, so Trellis won’t guess. Try an account, a person, or a topic.`, c: [], gap: true }] }] };
  const item = { q, pending: true, a };
  S.thread.push(item); go('ask');
  setTimeout(() => { item.pending = false; if (S.view === 'ask') render(); }, 700);
}

  return `<section class="hero"><h1>Rules</h1><p class="sub">Trellis never sends email on its own. Every message waits for you.</p></section>
  <div class="stack">${D.rules.map(r => {
    const t = S.testing[r.id];
    return `<article class="item">
      <div class="item-head"><h3>${esc(r.name)}</h3>
        <div class="seg" role="group" aria-label="Mode"><button type="button" data-act="mode" data-id="${r.id}" data-m="test" aria-pressed="${r.mode === 'test'}">Test</button><button type="button" data-act="mode" data-id="${r.id}" data-m="enabled" aria-pressed="${r.mode === 'enabled'}">On</button></div></div>
      <p class="sentence">When <b>${r.when.map(esc).join(', ')}</b>, then <b>${r.then.map(esc).join(', ').toLowerCase()}</b>.</p>
      <p class="note-line faint">At most ${esc(r.limits)} · quiet ${esc(r.quiet)} · version ${r.ver}</p>
      <div>${t ? `<div class="results">${r.test.rows.map(([l, v, b]) => `<div><span class="v ${b ? 'bad' : ''}">${v}</span><span class="l">${esc(l.replace('Blocked: ', 'blocked · '))}</span></div>`).join('')}</div>`
        : `<button class="text-btn" data-act="test" data-id="${r.id}" type="button">Test on the last 30 days</button>`}</div>
    </article>`; }).join('')}</div>`;
}
function renderData(){
  const status = c => c.status === 'ok' ? '<span class="dotc" style="background:var(--good)"></span>Connected' : c.status === 'error' ? '<span class="no"><span class="dotc" style="background:var(--bad)"></span>Disconnected</span>' : '<span class="faint">Optional</span>';
  return `<section class="hero"><h1>Sources</h1><p class="sub">Everything Trellis knows comes from here.</p></section>
  <div class="big-stats">
    <div><span class="label">Events today</span><div class="v">1,284</div><span class="l">from 5 sources</span></div>
    <div><span class="label">Duplicates caught</span><div class="v">312</div><span class="l">replays never double-count</span></div>
    <div><span class="label">Signal to alert</span><div class="v">1:52</div><span class="l">P95, target under 5:00</span></div>
    <div><span class="label">Contacts matched</span><div class="v">96.8%</div><span class="l">target 95%</span></div>
  </div>
  <div class="table-wrap"><table>
    <thead><tr><th>Source</th><th>Status</th><th>Last sync</th><th></th></tr></thead>
    <tbody>${D.connectors.map(c => `<tr><td><b>${esc(c.name)}</b><span class="s">${esc(c.vol)}</span>${c.err ? `<span class="s err">${esc(c.err)}</span>` : ''}</td><td style="white-space:nowrap">${status(c)}</td><td class="faint" style="white-space:nowrap">${c.last}</td><td class="r">${c.status === 'error' ? `<button class="btn primary small" data-act="reconnect" data-id="${c.id}" type="button">Reconnect</button>` : ''}</td></tr>`).join('')}</tbody>
  </table></div>
  <div class="split">
    <section><h3>Possible duplicate</h3>
      ${D.mergeOpen ? `<p class="muted" style="margin-top:8px">These might be the same person. The match isn’t certain, so Trellis asks first.</p>
      <div class="pair"><div><b>Priya Raman</b><span>priya.raman@acmelogistics.example</span></div><div><b>P. Raman</b><span>praman@acmelogistics.example</span></div></div>
      <div class="actions"><button class="btn primary" data-act="merge" type="button">Merge</button><button class="quiet" data-act="keep" type="button">Keep separate</button></div>` : '<p class="muted" style="margin-top:8px">Nothing to review.</p>'}
    </section>
    <section><h3>Privacy</h3>
      <dl class="kv"><dt>Email</dt><dd>Kept 3 years</dd><dt>Web activity</dt><dd>Kept 13 months · consent mode in EU and UK</dd><dt>AI training</dt><dd>Never on your data</dd><dt>Deletion</dt><dd>Removes events, search, and summaries</dd></dl>
    </section>
  </div>`;
}
function renderAudit(){
  const rows = D.audit.slice().sort((a, b) => a.ago - b.ago);
  return `<section class="hero"><h1>Activity log</h1><p class="sub">Every action, what triggered it, and who approved it.</p></section>
  <div class="table-wrap"><table>
    <thead><tr><th>When</th><th>Action</th><th>Trigger</th><th>Checks</th><th>Approved by</th></tr></thead>
    <tbody>${rows.map(r => `<tr><td class="faint" style="white-space:nowrap">${when(r.ago)}</td><td><b>${esc(r.action)}</b><span class="s">${esc(r.target)} · ${esc(r.outcome)}</span></td><td class="muted">${esc(r.trigger)}</td><td>${r.policy.startsWith('Blocked') ? `<span class="no">${esc(r.policy)}</span>` : `<span class="ok">${esc(r.policy)}</span>`}</td><td>${esc(r.approver)}</td></tr>`).join('')}</tbody>
  </table></div>`;
}

/* ---------- Evidence sheet ---------- */
function openEvidence(refs, idx){
  S.evList = refs; S.evIdx = idx;
  const { id, line } = parseRef(refs[idx]); const e = ev(id); if (!e) return;
  const p = person(e.person), a = D.accounts[e.acct], b = e.body;
  let src;
  if (b.kind === 'email') src = `<div class="src"><div class="hdr"><span>From</span><span>${esc(b.from)}</span><span>To</span><span>${esc(b.to)}</span><span>Subject</span><span>${esc(b.subject)}</span></div><div class="txt">${esc(b.text)}</div></div>`;
  else if (b.kind === 'lines') src = `<ol class="lines src">${b.lines.map((l, i) => `<li class="${line === i + 1 ? 'hit' : ''}">${esc(l)}</li>`).join('')}</ol>`;
  else src = `<dl class="kv" style="margin:0">${b.rows.map(([k, v]) => `<dt>${esc(k)}</dt><dd>${esc(v)}</dd>`).join('')}</dl>`;
  const occurred = atOf(e.ago);
  const envelope = {
    id: 'evt_01J9' + id.toUpperCase().padStart(6, '0'), tenant_id: 'tnt_trellis', source: e.src.split(' ')[0].toLowerCase(),
    source_event_id: (b.kind === 'email' ? 'gmail:msg_' : 'src_') + (18830 + e.ago).toString(36), type: e.type,
    occurred_at: occurred.toISOString(), ingested_at: new Date(occurred.getTime() + 38000).toISOString(),
    person_candidates: e.person ? [{ id: 'per_' + e.person, method: e.ident, confidence: e.conf }] : [],
    account_candidates: [{ id: 'acc_' + e.acct }], channel: chOf(e.type), content_ref: 'obj://tnt_trellis/' + id,
    consent_basis: e.acct === 'corvid' ? 'legitimate_interest_account_level' : 'existing_relationship', identity_confidence: e.conf, schema_version: '1.0'
  };
  const n = refs.length;
  document.getElementById('drawerRoot').innerHTML = `<div class="scrim" data-act="close"></div>
  <aside class="sheet" role="dialog" aria-modal="true" aria-label="Source">
    <div class="sheet-head">
      <span class="pager">${n > 1 ? `<button class="icon-btn" data-act="evStep" data-d="-1" ${idx === 0 ? 'disabled' : ''} aria-label="Previous source" type="button">${CHEV.replace('m4.5 2.5 3.5 3.5-3.5 3.5', 'm7.5 2.5-3.5 3.5 3.5 3.5')}</button>${idx + 1} of ${n}<button class="icon-btn" data-act="evStep" data-d="1" ${idx === n - 1 ? 'disabled' : ''} aria-label="Next source" type="button">${CHEV}</button>` : 'Source'}</span>
      <button class="icon-btn" data-act="close" aria-label="Close" type="button">${XICON}</button>
    </div>
    <div class="sheet-body">
      <div><p class="label" style="margin-bottom:8px">${CH[chOf(e.type)].label} · ${when(e.ago)}</p><h2 style="font-size:26px">${esc(e.title)}</h2>
        <p class="muted" style="margin-top:8px"><a href="#acct-${e.acct}" data-act="close">${esc(a.name)}</a>${p ? ' · ' + esc(p.name) : ''}</p>
        ${e.ident !== '—' ? `<p class="faint" style="margin-top:4px;font-size:14px">${confText(e.conf, e.ident)}</p>` : ''}</div>
      ${e.weak ? '<p class="weak">Opens are unreliable. Privacy proxies and security scanners trigger them, so they never count toward a signal.</p>' : ''}
      ${src}
      <div><button class="disclose" data-act="toggleEnv" aria-expanded="false" type="button">${CHEV} Technical details</button><pre class="env" hidden>${esc(JSON.stringify(envelope, null, 2))}</pre></div>
    </div>
  </aside>`;
  document.querySelector('.sheet [data-act="close"].icon-btn').focus();
}
function closeLayers(){ document.getElementById('drawerRoot').innerHTML = ''; document.getElementById('modalRoot').innerHTML = ''; }

/* ---------- Draft ---------- */
function checksFor(s){
  const p = person(s.draft.to);
  return [
    ['Identity', p.conf + ' confidence', true],
    ['Consent', 'Existing relationship', true],
    ['Frequency', 'No email to ' + p.name.split(' ')[0] + ' this week', true],
    ['Do not contact', p.dnc ? 'On the list since 12 Aug' : 'Not on the list', !p.dnc],
    ['Owner', 'You own this account', true]
  ];
}
function openDraft(id){
  const s = D.signals.find(x => x.id === id); if (!s || !s.draft) return;
  const p = person(s.draft.to), checks = checksFor(s), blocked = checks.some(c => !c[2]);
  const refs = s.draft.why.map(w => w[1]);
  document.getElementById('modalRoot').innerHTML = `<div class="modal-wrap"><div class="scrim" data-act="close"></div>
  <div class="modal" role="dialog" aria-modal="true" aria-label="Email to ${esc(p.name)}">
    <div class="modal-head"><span class="label">New email</span><button class="icon-btn" data-act="close" aria-label="Close" type="button">${XICON}</button></div>
    <div class="compose">
      <div class="field"><label for="dTo">To</label><input id="dTo" value="${esc(p.name)} <${esc(p.email)}>" readonly></div>
      <div class="field"><label for="dSubj">Subject</label><input id="dSubj" value="${esc(s.draft.subject)}"></div>
      <textarea id="dBody" aria-label="Message">${esc(s.draft.body)}</textarea>
    </div>
    <div class="modal-info">
      <p class="muted">Written from ${s.draft.why.map(([t, r], i) => `${esc(t)}${cites([r], () => i + 1).replace(/data-refs="[^"]*"/, `data-refs="${refs.join(',')}"`)}`).join('; ')}.</p>
      ${blocked ? `<ul class="checks">${checks.map(([k, d, ok]) => `<li class="${ok ? '' : 'fail'}"><span class="${ok ? 'ok' : 'no'}">${ok ? '✓' : '✕'}</span> <b>${k}</b> · ${esc(d)}</li>`).join('')}</ul>`
        : `<button class="disclose" data-act="toggleChecks" aria-expanded="${S.showChecks}" type="button"><span class="ok">✓</span>&nbsp;All 5 checks passed</button>${S.showChecks ? `<ul class="checks">${checks.map(([k, d]) => `<li><span class="ok">✓</span> <b>${k}</b> · ${esc(d)}</li>`).join('')}</ul>` : ''}`}
    </div>
    <div class="modal-foot">
      ${blocked ? `<span class="no" style="font-size:14px;font-weight:500">Can’t send. ${esc(p.name)} asked not to be contacted.</span>` : '<button class="quiet" data-act="saveDraft" data-id="' + s.id + '" type="button">Save to Gmail drafts</button>'}
      <div class="actions"><button class="btn" data-act="close" type="button">Cancel</button><button class="btn primary" data-act="approve" data-id="${s.id}" type="button" ${blocked ? 'disabled' : ''}>Send</button></div>
    </div>
  </div></div>`;
  if (!blocked) document.getElementById('dBody').focus();
}

/* ---------- Actions ---------- */
function toast(title, sub){
  const t = document.createElement('div'); t.className = 'toast';
  t.innerHTML = `${esc(title)}${sub ? ` <span>${esc(sub)}</span>` : ''}`;
  document.getElementById('toasts').appendChild(t);
  setTimeout(() => t.remove(), 3800);
}
function finish(s, result, audit){
  s.status = audit.status || 'done'; s.result = result; S.dismissing = null;
  D.audit.push({ ago: 0, action: audit.action, target: audit.target, trigger: 'Signal: ' + s.title, policy: audit.policy || 'Passed', approver: audit.approver || ME.name, outcome: audit.outcome });
}
function simulate(){
  if (S.simulated) return;
  S.simulated = true;
  const btn = document.getElementById('simBtn'); btn.disabled = true; btn.innerHTML = 'Live event sent';
  const add = [
    { id: 'm1', acct: 'acme', person: 'marcus', type: 'link.clicked', ago: 0, title: 'Clicked “Security overview”', meta: 'from “Security questionnaire + SOC 2”', src: 'Tracked links', ident: 'Signed link token', conf: 'High',
      body: { kind: 'rows', rows: [['Link', 'Security overview'], ['Destination', 'trellisfleet.example/security'], ['Recipient', 'marcus.lee@acmelogistics.example'], ['Identity', 'First click binds this browser to Marcus']] } },
    { id: 'm2', acct: 'acme', person: 'marcus', type: 'page.viewed', ago: 0, title: 'Viewed /trust/soc2', meta: '2 min 48 s', src: 'Web SDK', ident: 'Tracked link', conf: 'High',
      body: { kind: 'rows', rows: [['Page', 'trellisfleet.example/trust/soc2'], ['From', 'trellisfleet.example/security'], ['Time on page', '2 min 48 s']] } }
  ];
  D.events.push(...add); add.forEach(e => S.newIds.add(e.id));
  toast('Marcus Lee just clicked your security link.');
  if (S.view === 'account' && S.acct === 'acme') render();
  setTimeout(() => {
    D.signals.push({ id: 's6', acct: 'acme', person: 'marcus', kind: 'Buying signal', title: 'Security review started', strength: 71, ago: 0, status: 'open',
      components: [
        { l: 'Read the SOC 2 page for almost 3 minutes', p: 30, ev: ['m2'] },
        { l: 'First click from Marcus, via the security email', p: 21, ev: ['m1'] },
        { l: 'Asked for the SOC 2 report yesterday', p: 20, ev: ['e4#3'] },
        { l: 'Earlier open of the same email', p: 0, ev: ['e6'], x: 'Opens don’t count. Scanners and privacy proxies trigger them.' }
      ],
      rec: { kind: 'draft', text: 'Send Marcus the SOC 2 report while he’s reading.' },
      draft: { to: 'marcus', subject: 'SOC 2 Type II report for Acme’s review',
        body: 'Hi Marcus,\n\nAs discussed in yesterday’s check-in, here is our SOC 2 Type II report (period ending 30 Jun 2026) and the completed security questionnaire.\n\nIf it helps, I can set up 30 minutes with our security lead for any follow-ups.\n\nJordan',
        why: [['Marcus asking for the SOC 2 report', 'e4#3'], ['him reading the SOC 2 page right now', 'm2']] } });
    D.accounts.acme.summary.push({ t: 'Marcus started the security review today and is reading the SOC 2 page.', c: ['m1', 'm2'] });
    D.accounts.acme.summaryAgo = 0;
    S.newIds.add('s6');
    toast('New signal from Acme.', 'Arrived 1 min 52 s after the click.');
    render();
  }, 1400);
}
function tidyCopy(){
  // Shorter, plainer recommendation and exclusion copy for this design.
  const r = { s1: 'Send Priya a short plan that shows go-live before quarter-end.', s2: 'Send Tomás the MSA in Word and loop in legal today.', s3: 'Give Aisha a one-page pilot plan for her board.', s4: 'Find a real contact at Corvid before reaching out.', s5: 'Let the owner know. Outreach stays off.' };
  D.signals.forEach(s => {
    if (r[s.id]) s.rec.text = r[s.id];
    s.components.forEach(c => { if (c.x) c.x = 'Opens don’t count. Scanners and privacy proxies trigger them.'; });
  });
  const why = { s1: [['Priya’s timing question in yesterday’s check-in', 'e4#2'], ['her reading the implementation guide this morning', 'e2'], ['Marcus’s SOC 2 request', 'e4#3']],
    s2: [['Tomás’s MSA redline request', 'b1'], ['his ask for a Word version', 'b4']],
    s3: [['Aisha’s October board deadline', 'n2#2'], ['8 business days without a reply', 'n1']],
    s5: [['Ben viewing pricing today', 'h1']] };
  D.signals.forEach(s => { if (why[s.id]) s.draft.why = why[s.id]; });
  if (D.signals.find(s => s.id === 's4')) D.signals.find(s => s.id === 's4').locked = 'We only know the company, not the person, so email is off.';
}
tidyCopy();

document.addEventListener('click', e => {
  const menu = document.getElementById('menu');
  if (!menu.hidden && !e.target.closest('#menu') && !e.target.closest('#menuBtn')) toggleMenu(false);
  const t = e.target.closest('[data-act]'); if (!t) return;
  const act = t.dataset.act, id = t.dataset.id;
  const s = id ? D.signals.find(x => x.id === id) : null;
  switch (act){
    case 'menu': toggleMenu(); break;
    case 'closeMenu': toggleMenu(false); break;
    case 'sig':
      S.sig = id; S.dismissing = null; S.newIds.delete(id);
      if (S.view !== 'queue') go('queue'); else render();
      if (window.innerWidth <= 980) document.getElementById('detail')?.scrollIntoView({ block: 'start' });
      break;
    case 'ev': { e.preventDefault(); const refs = t.dataset.refs ? t.dataset.refs.split(',') : [t.dataset.ref]; openEvidence(refs, Math.max(0, refs.indexOf(t.dataset.ref))); break; }
    case 'evStep': openEvidence(S.evList, S.evIdx + +t.dataset.d); break;
    case 'toggleEnv': { const pre = t.nextElementSibling; pre.hidden = !pre.hidden; t.setAttribute('aria-expanded', !pre.hidden); break; }
    case 'toggleWhy': S.showWhy = !S.showWhy; render(); break;
    case 'toggleChecks': {
      S.showChecks = !S.showChecks;
      const subj = document.getElementById('dSubj').value, body = document.getElementById('dBody').value, sid = document.querySelector('.modal [data-act="approve"]').dataset.id;
      openDraft(sid); document.getElementById('dSubj').value = subj; document.getElementById('dBody').value = body; break;
    }
    case 'close': closeLayers(); break;
    case 'draft': openDraft(id); break;
    case 'approve': {
      const p = person(s.draft.to), subj = document.getElementById('dSubj').value;
      D.events.push({ id: 'x' + Date.now(), acct: s.acct, person: s.draft.to, type: 'email.sent', ago: 0, title: `Sent “${subj}”`, meta: 'approved by you', src: 'Gmail', ident: 'Email address', conf: 'Very high',
        body: { kind: 'email', from: ME.email, to: p.email, subject: subj, text: document.getElementById('dBody').value } });
      finish(s, `Sent to ${p.name}. It’s on the ${D.accounts[s.acct].name} timeline.`, { action: 'Email sent', target: p.name, policy: 'Passed 5 of 5', outcome: 'Delivered via Gmail' });
      closeLayers(); toast('Sent.', `To ${p.name}, from your Gmail.`); render(); break;
    }
    case 'saveDraft': {
      const p = person(s.draft.to);
      finish(s, `Saved to your Gmail drafts for ${p.name}.`, { action: 'Draft saved', target: p.name, outcome: 'In Gmail drafts' });
      closeLayers(); toast('Saved to Gmail drafts.'); render(); break;
    }
    case 'task': {
      const task = s.rec.task || `Follow up: ${s.title}`, due = s.rec.due || 'Tomorrow';
      finish(s, `Task added: ${task}. Due ${due.toLowerCase()}.`, { action: 'Task created', target: D.accounts[s.acct].name, outcome: 'Due ' + due.toLowerCase() });
      toast('Task added.', task); render(); break;
    }
    case 'notify':
      finish(s, `${ME.name} was notified. No one at ${D.accounts[s.acct].name} was contacted.`, { action: 'Owner notified', target: D.accounts[s.acct].name, policy: 'Passed (internal)', outcome: 'In-app and email alert' });
      toast('Owner notified.'); render(); break;
    case 'snooze':
      finish(s, 'Snoozed until tomorrow morning. It comes back sooner if something new happens.', { action: 'Signal snoozed', target: D.accounts[s.acct].name, outcome: 'Until tomorrow 09:00', status: 'snoozed' });
      render(); break;
    case 'dismiss': S.dismissing = S.dismissing === id ? null : id; render(); break;
    case 'dismissReason':
      finish(s, `Dismissed as “${t.dataset.reason.toLowerCase()}”. Trellis learns from this.`, { action: 'Signal dismissed', target: D.accounts[s.acct].name, outcome: 'Reason: ' + t.dataset.reason.toLowerCase(), status: 'dismissed' });
      render(); break;
    case 'reopen': s.status = 'open'; s.result = ''; render(); break;
    case 'filter': S.filter = t.dataset.f; render(); break;
    case 'goacct': go('acct-' + id); break;
    case 'askAbout': ask(id === 'acme' ? ANSWERS.change.q : `What changed at ${D.accounts[id].name} this week?`, id === 'acme' ? 'change' : null); break;
    case 'preset': ask(ANSWERS[t.dataset.k].q, t.dataset.k); break;
    case 'freeq': ask(t.dataset.q, null); break;
    case 'mode': { const r = D.rules.find(x => x.id === id); r.mode = t.dataset.m; toast(r.mode === 'test' ? 'Test mode.' : 'Rule is on.', r.mode === 'test' ? 'It will log matches without acting.' : 'Emails still wait for you.'); render(); break; }
    case 'test': S.testing[id] = true; render(); break;
    case 'reconnect': { const c = D.connectors.find(x => x.id === id); c.status = 'ok'; c.last = 'Just now'; c.err = ''; c.vol = '1,122 events · catching up on the last 3 hours'; toast('Calendar reconnected.', 'Catching up on the last 3 hours.'); render(); break; }
    case 'merge': D.mergeOpen = false; toast('Merged.', 'You can undo this from Priya’s profile.'); render(); break;
    case 'keep': D.mergeOpen = false; toast('Kept separate.'); render(); break;
    case 'simulate': simulate(); break;
    case 'reset':
      D = structuredClone(INITIAL); tidyCopy();
      Object.assign(S, { sig: 's1', filter: 'all', dismissing: null, simulated: false, testing: {}, thread: [], newIds: new Set(), showWhy: true, showChecks: false });
      { const b = document.getElementById('simBtn'); b.disabled = false; b.innerHTML = 'Simulate<span>&nbsp;live event</span>'; }
      toggleMenu(false); seedThread(); closeLayers(); go('queue'); toast('Demo reset.'); break;
  }
});
document.addEventListener('keydown', e => {
  if (e.key === 'Escape') { closeLayers(); toggleMenu(false); }
  if (e.key === 'Enter' && e.target.matches('tr.link')) e.target.click();
});
document.addEventListener('submit', e => {
  e.preventDefault();
  const input = e.target.querySelector('input');
  if (input && input.value.trim()) { const q = input.value; input.value = ''; ask(q); }
});

/* ---------- Routing ---------- */
function go(hash){ if (location.hash === '#' + hash) route(); else location.hash = hash; }
function route(){
  const h = location.hash.slice(1) || 'queue';
  if (h.startsWith('acct-')) { const id = h.slice(5); if (S.acct !== id) S.filter = 'all'; S.view = 'account'; S.acct = id; }
  else S.view = ['queue', 'accounts', 'ask', 'rules', 'data', 'audit'].includes(h) ? h : 'queue';
  closeLayers(); toggleMenu(false); render(); window.scrollTo(0, 0);
}
function render(){
  document.getElementById('view').innerHTML = { queue: renderQueue, accounts: renderAccounts, ask: renderAsk, rules: renderRules, data: renderData, audit: renderAudit }[S.view]?.() ?? renderAccount(S.acct);
  renderChrome();
}
function seedThread(){ S.thread = [{ q: ANSWERS.change.q, pending: false, a: ANSWERS.change }]; }
seedThread();
window.addEventListener('hashchange', route);
route();
</script>
